<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>מילים באנגלית</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔤</text></svg>">
<style>
  :root {
    --page: #eef2ff; --card: #ffffff; --ink: #1e1b4b; --soft: #6366f1; --muted: #64748b;
    --main: #4f46e5; --main-ink: #ffffff; --line: #e0e7ff;
    --good: #16a34a; --good-bg: #dcfce7; --bad: #dc2626; --bad-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0f172a; --card: #1e293b; --ink: #f1f5f9; --soft: #a5b4fc; --muted: #94a3b8;
      --main: #6366f1; --main-ink: #ffffff; --line: #334155;
      --good: #4ade80; --good-bg: #14532d; --bad: #f87171; --bad-bg: #7f1d1d;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: system-ui, "Segoe UI", Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; min-height: 100dvh; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 8px 0 0; font-size: 28px; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 0; }
  .card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  button { font: inherit; border: 0; border-radius: 16px; cursor: pointer; }
  .big { background: var(--main); color: var(--main-ink); font-size: 22px; font-weight: 700; padding: 16px; width: 100%; }
  .big:disabled { opacity: .5; }
  .ghost { background: transparent; color: var(--soft); font-size: 17px; padding: 10px; }
  .bar { height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--good); width: 0; transition: width .4s; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .top .ghost { padding: 6px 0; }
  .stars { font-weight: 700; font-size: 18px; }
  .word { direction: ltr; text-align: center; font-size: 64px; font-weight: 800; letter-spacing: 1px; margin: 8px 0; }
  .pic { text-align: center; font-size: 72px; line-height: 1; min-height: 72px; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .mic { background: var(--main); color: var(--main-ink); font-size: 22px; font-weight: 700; padding: 18px; }
  .mic.on { background: var(--bad); animation: pulse 1s infinite; }
  .hear { background: var(--line); color: var(--ink); font-size: 22px; padding: 18px; flex: 0 0 80px; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .msg { text-align: center; font-size: 20px; min-height: 30px; margin: 4px 0 0; font-weight: 600; }
  .msg.good { color: var(--good); } .msg.bad { color: var(--bad); }
  .heard { text-align: center; color: var(--muted); direction: ltr; min-height: 22px; margin: 0; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choice { background: var(--card); color: var(--ink); border: 3px solid var(--line); font-size: 24px; font-weight: 700; padding: 20px 8px; }
  .choice.good { background: var(--good-bg); border-color: var(--good); }
  .choice.bad { background: var(--bad-bg); border-color: var(--bad); }
  .list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 12px; background: var(--page); font-size: 17px; }
  .item b { direction: ltr; }
  .item.done { background: var(--good-bg); }
  h2 { margin: 0 0 12px; font-size: 20px; }
  .word.sentence { font-size: 40px; }
  .btn-lock { background: var(--line); color: var(--muted); }
  .hidden { display: none !important; }
  .note { font-size: 15px; color: var(--muted); text-align: center; margin: 0; }
  @media (min-width: 1024px) {
    main { max-width: 760px; padding-top: 40px; }
    .list { grid-template-columns: 1fr 1fr 1fr; }
    .word { font-size: 80px; }
  }
</style>
</head>
<body>
<main id="app">
  <!-- מסך הבית -->
  <section id="home">
    <h1>🔤 מילים באנגלית</h1>
    <p class="sub">קוראים בקול ובוחרים את התרגום. צריך 80% כדי לעבור שלב</p>
    <div class="card" style="margin-top:16px">
      <h2>שלב 1 – מילים</h2>
      <div class="top"><span id="count"></span><span class="stars" id="homeStars"></span></div>
      <div class="bar" style="margin:12px 0 8px"><i id="homeBar"></i></div>
      <p class="note" id="wordsBest" style="margin-bottom:16px"></p>
      <button class="big" id="start">🎤 מתחילים!</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>שלב 2 – משפטים</h2>
      <p class="note" id="sentNote" style="margin-bottom:16px"></p>
      <button class="big" id="startSent">📖 למשפטים</button>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="list" id="list"></div>
      <button class="ghost" id="reset" style="width:100%;margin-top:12px">להתחיל את הרשימה מההתחלה</button>
    </div>
  </section>

  <!-- סוף סיבוב -->
  <section id="result" class="hidden">
    <div class="card" style="margin-top:24px;text-align:center">
      <div class="pic" id="resPic"></div>
      <p class="msg" id="resScore" style="font-size:26px"></p>
      <p class="msg" id="resMsg"></p>
      <button class="big" id="resGo" style="margin-top:16px"></button>
      <button class="ghost" id="resHome" style="width:100%;margin-top:8px">למסך הראשי</button>
    </div>
  </section>

  <!-- מסך התרגול -->
  <section id="play" class="hidden">
    <div class="top">
      <button class="ghost" id="back">→ חזרה</button>
      <span id="pos" class="note"></span>
      <span class="stars" id="stars"></span>
    </div>
    <div class="card">
      <div class="pic" id="pic"></div>
      <div class="word" id="word"></div>
      <button class="hear hidden" id="hearSent" style="display:block;margin:0 auto 12px;padding:10px 24px">🔊 להקשיב</button>

      <div id="sayStep">
        <div class="row">
          <button class="mic" id="mic">🎤 לחץ ותגיד את המילה</button>
          <button class="hear" id="hear" aria-label="להקשיב למילה">🔊</button>
        </div>
        <p class="msg" id="sayMsg"></p>
        <p class="heard" id="heard"></p>
        <button class="ghost hidden" id="skipSay" style="width:100%">אמרתי את המילה ✓ – להמשיך</button>
        <p class="note hidden" id="noMic">המכשיר הזה לא מזהה דיבור. אפשר להגיד את המילה למבוגר וללחוץ "אמרתי את המילה".</p>
      </div>

      <div id="chooseStep" class="hidden">
        <p class="msg" id="ask">מה פירוש המילה?</p>
        <div class="choices" id="choices"></div>
        <p class="msg" id="chooseMsg"></p>
        <button class="big hidden" id="next" style="margin-top:8px">הבאה ←</button>
      </div>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
