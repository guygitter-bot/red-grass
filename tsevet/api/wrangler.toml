name = "tsevet-api"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# האתרים שמותר להם לפנות לשרת (* = תת-כתובת של גרסה ב-Cloudflare Pages)
ALLOWED_ORIGINS = "https://tsevet-ai.pages.dev,https://*.tsevet-ai.pages.dev,http://localhost:5173,http://localhost:4173"
# עריכת וידאו רצה ב-GitHub Actions של המאגר הזה (tsevet-render.yml); הטוקן: הסוד GITHUB_TOKEN (מ-POINTS_GITHUB_TOKEN)
GITHUB_REPO = "guygitter-bot/red-grass"
# מחולל הווידאו של Google (Gemini Omni). אם השם כבר לא קיים – השרת מנסה את הגרסאות המוכרות (gen.js)
VIDEO_MODEL = "gemini-omni-1.2-flash"
# תקרה יומית של סרטונים שנוצרים (כל אחד גם מאושר בכפתור)
DAILY_CLIPS = "10"
# כתובת האפליקציה (לקישור בהתראות לטלפון)
APP_URL = "https://tsevet-ai.pages.dev/"

# קבצים שמעלים בשיחה (תמונות, סרטונים, שירים) וסרטונים ערוכים
[[r2_buckets]]
binding = "FILES"
bucket_name = "tsevet-files"

# "מאגר AI" (ai_maagar) – הבוטים מחפשים וקוראים שם, והספרן מלמד מזה את הצוות
[[services]]
binding = "MAAGAR"
service = "ai-maagar-api"

# אפליקציית "בורסאי" (bursa/) – הבוט 📈 בורסאי קורא משם ומבצע פעולות (המפתח: tsevet/api/bursa.js)
[[services]]
binding = "BURSA"
service = "bursa-api"

# כל הצוות (בוטים, שיחות, זיכרון, עלויות) – אובייקט אחד ("main")
[[durable_objects.bindings]]
name = "TEAM"
class_name = "Team"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Team"]

# סודות, לא כאן (נקבעים אוטומטית מ-GitHub, ראו .github/workflows/tsevet.yml):
#   ANTHROPIC_API_KEY   – המפתח של Claude
#   TG_CREATIVE_TOKEN   – הבוט 🎨 קריאייטיב (מ-BotFather)
#   TG_CAMPAIGNS_TOKEN  – הבוט 📊 קמפיינים (מ-BotFather)
#   TEAM_OWNER_CODE     – הקוד שהבעלים שולח פעם אחת: /start <קוד>
#   GEMINI_API_KEY      – לא חובה: מפעיל יצירת סרטונים (המפתח של Google AI Studio, כמו ב-nadlan_video)
#   GITHUB_TOKEN        – לא חובה: מפעיל את עריכת הווידאו (נקבע מ-POINTS_GITHUB_TOKEN)
