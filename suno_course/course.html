<title>ערוץ מוזיקה מסונו</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Secular+One&display=swap">
<style>
/* פריסה: קונסולת מיקס – רצועת ערוצים (פרקים) בצד, משטח עבודה רחב, מד VU כפס התקדמות */
:root{
  --bg:#EEF1F2; --panel:#FFFFFF; --sunk:#E3E8EA; --line:#CDD6D9;
  --fg:#11191C; --muted:#56656B;
  --accent:#0B7A69; --accent-ink:#FFFFFF; --accent-soft:#D3EDE7;
  --meter:#D98E04; --meter-soft:#FBEBCB;
  --ok:#1E8A44; --ok-soft:#DDF2E3; --warn:#B86200; --warn-soft:#FCEBD6; --bad:#C22E2E; --bad-soft:#FADDDD;
  --f-display:"Secular One","IBM Plex Sans Hebrew",Arial,sans-serif;
  --f-body:"IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1416; --panel:#152024; --sunk:#0A1012; --line:#26353A;
  --fg:#E6EEF0; --muted:#93A6AC;
  --accent:#2CC4A8; --accent-ink:#04211B; --accent-soft:#123A33;
  --meter:#F2AE2E; --meter-soft:#3A2C0E;
  --ok:#4CC777; --ok-soft:#123222; --warn:#F0A04B; --warn-soft:#3A2710; --bad:#F06A6A; --bad-soft:#3D1616;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1416; --panel:#152024; --sunk:#0A1012; --line:#26353A;
  --fg:#E6EEF0; --muted:#93A6AC;
  --accent:#2CC4A8; --accent-ink:#04211B; --accent-soft:#123A33;
  --meter:#F2AE2E; --meter-soft:#3A2C0E;
  --ok:#4CC777; --ok-soft:#123222; --warn:#F0A04B; --warn-soft:#3A2710; --bad:#F06A6A; --bad-soft:#3D1616;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.65;direction:rtl}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--meter);outline-offset:2px}
.mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.tnum{font-variant-numeric:tabular-nums}

/* מעטפת */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-inline-start:0;border-inline-end:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;padding-block:20px;padding-inline:max(16px,env(safe-area-inset-right,0px)) 16px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.brand h1{font-size:22px}
.brand-sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.vu{display:flex;gap:3px;align-items:flex-end;height:26px}
.vu i{display:block;width:5px;border-radius:2px;background:var(--sunk)}
.vu i.on{background:var(--accent)} .vu i.hot{background:var(--meter)}
.progress-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:10px 0 4px}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--meter));border-radius:99px}
.navgroup{margin-top:18px}
.navgroup h4{font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.nav a{display:grid;grid-template-columns:28px 1fr 18px;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;color:var(--fg);text-decoration:none;font-size:14.5px;line-height:1.35}
.nav a:hover{background:var(--sunk)}
.nav a.cur{background:var(--accent-soft);color:var(--fg);font-weight:600}
.nav .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center}
.nav .done{color:var(--ok);font-size:14px}
.side-tools{margin-top:18px;display:grid;gap:6px}
.side-tools button{text-align:start}

.main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin-inline:auto}
.topbar{display:none}

/* כותרת פרק */
.mhead{display:grid;gap:8px;margin-bottom:22px}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
.mhead h2{font-size:clamp(28px,4vw,40px)}
.mmeta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:99px;padding:3px 10px;font-size:13px}
.lead{font-size:18px;color:var(--fg);max-width:65ch}

.content h3{font-size:24px;margin:34px 0 10px}
.content h4{font-size:18px;margin:22px 0 6px}
.content p,.content li{max-width:68ch}
.content ul,.content ol{padding-inline-start:22px}
.content li{margin-bottom:4px}

/* צעדים */
.steps{counter-reset:st;display:grid;gap:12px;margin:14px 0;padding:0;list-style:none}
.steps>li{counter-increment:st;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;max-width:none}
.steps>li::before{content:counter(st);font-family:var(--f-mono);font-weight:600;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:14px}
.steps>li b{display:block}

/* קופסאות */
.box{border-radius:var(--r);padding:14px 16px;margin:16px 0;border:1px solid var(--line);background:var(--panel)}
.box>:first-child{margin-top:0}.box>:last-child{margin-bottom:0}
.box .bt{font-weight:700;display:block;margin-bottom:4px}
.box.tip{background:var(--accent-soft);border-color:transparent}
.box.warn{background:var(--warn-soft);border-color:transparent}
.box.bad{background:var(--bad-soft);border-color:transparent}
.box.ok{background:var(--ok-soft);border-color:transparent}
.box.src{font-size:13.5px;color:var(--muted);background:transparent;border-style:dashed}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
.yes,.no{border-radius:var(--r);padding:12px 14px}
.yes{background:var(--ok-soft)} .no{background:var(--bad-soft)}
.yes h4,.no h4{margin:0 0 6px;font-size:17px}
.yes ul,.no ul{margin:0;padding-inline-start:18px}

.tbl{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
td.tnum{white-space:nowrap}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.g{background:var(--ok-soft);color:var(--ok)} .pill.y{background:var(--warn-soft);color:var(--warn)} .pill.r{background:var(--bad-soft);color:var(--bad)}

/* כפתורים וטפסים */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:15px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-width:0;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.field textarea{min-height:90px;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 11px;font-size:13.5px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* כלי */
.tool{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:20px 0;display:grid;gap:14px}
.tool-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tool-h h3{margin:0;font-size:21px}
.tag{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--meter);background:var(--meter-soft);border-radius:6px;padding:2px 8px}
.out{background:var(--sunk);border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:13.5px;direction:ltr;text-align:left;unicode-bidi:plaintext}
.out.he{font-family:var(--f-body);direction:rtl;text-align:right;font-size:15px}
.copyrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;font-size:13px;color:var(--muted)}
.stat{background:var(--sunk);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.stat span{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.note{font-size:13px;color:var(--muted)}
.ai-out{white-space:pre-wrap;line-height:1.7}
.chat{display:grid;gap:10px;align-content:start;max-height:460px;overflow:auto;padding:4px}
.msg{border-radius:12px;padding:10px 12px;max-width:92%;white-space:pre-wrap;word-break:break-word}
.msg.me{background:var(--accent-soft);justify-self:start}
.msg.ai{background:var(--sunk);justify-self:end}

/* מוקאפ מסכים */
.shot{margin:18px 0}
.shot figcaption{font-size:13.5px;color:var(--muted);margin-top:6px}
.shot figcaption b{color:var(--fg)}
.frame{border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 1px 0 var(--line);direction:ltr;text-align:left;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.35;position:relative}
.frame .chrome{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#DADFE2;color:#333}
.frame .chrome i{width:10px;height:10px;border-radius:50%;background:#B9C0C4;display:inline-block}
.frame .url{flex:1;background:#fff;border-radius:6px;padding:3px 10px;color:#444;font-size:11.5px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.shot img{border:0}
.frame .illus{position:absolute;top:6px;right:10px;font-family:var(--f-body);direction:rtl;font-size:11px;background:#fff9;color:#333;padding:1px 7px;border-radius:5px}
.scr{position:relative;overflow:hidden}
.pin{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--meter);color:#1b1200;font:700 12.5px/24px var(--f-mono);text-align:center;box-shadow:0 0 0 3px rgba(217,142,4,.35);z-index:3}
.legend{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px;direction:rtl}
.legend li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;max-width:none;font-size:14.5px}
.legend li::before{content:attr(data-n);width:22px;height:22px;border-radius:50%;background:var(--meter);color:#1b1200;font:700 12px/22px var(--f-mono);text-align:center}
.fscroll{overflow-x:auto}
.fscroll .scr{min-width:640px}

/* צבעי אפליקציות במוקאפים – קבועים בכוונה, כמו באפליקציה האמיתית */
.suno{background:#101012;color:#E8E8EA}
.suno .s-side{background:#0B0B0C;border-right:1px solid #222}
.suno .s-in{background:#1C1C1F;border:1px solid #2C2C30;border-radius:8px;padding:8px;color:#CFCFD4}
.suno .s-btn{background:linear-gradient(90deg,#F7B733,#FC4A1A);color:#111;border-radius:99px;padding:8px 14px;font-weight:700;text-align:center}
.suno .s-tab{padding:4px 10px;border-radius:99px;background:#232327;color:#ccc}
.suno .s-tab.on{background:#E8E8EA;color:#111}
.suno .s-dim{color:#8B8B92}
.yt{background:#fff;color:#0F0F0F}
.yt .y-side{background:#fff;border-right:1px solid #E5E5E5}
.yt .y-red{background:#FF0033;color:#fff}
.yt .y-blue{background:#065FD4;color:#fff;border-radius:3px;padding:6px 12px;font-weight:600;display:inline-block}
.yt .y-in{border:1px solid #CCC;border-radius:4px;padding:7px 9px;color:#333;background:#fff}
.yt .y-dim{color:#606060}
.cc{background:#18181A;color:#E9E9EB}
.cc .c-panel{background:#232326;border:1px solid #2F2F33}
.cc .c-dim{color:#8D8D94}

/* כרטיס חידון */
.quiz{display:grid;gap:8px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.q .qa{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.q .res{margin-top:8px;font-size:14.5px}

.done-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}
.checklist{list-style:none;padding:0;display:grid;gap:6px}
.checklist li{max-width:none}
.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.checklist input{margin-top:5px;accent-color:var(--accent)}

/* צ'אט צף */
.fab{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:99px;padding:11px 16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.drawer{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(480px,calc(100vw - 32px));max-height:min(760px,calc(100vh - 100px));height:min(760px,calc(100vh - 100px));z-index:21;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.drawer header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .chat{max-height:none;padding:12px}
.drawer form{display:grid;gap:8px;padding:10px;border-top:1px solid var(--line)}
.drawer .row .btn{flex:0 0 auto}
.msg .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.msg .thumbs img{width:96px;height:auto;border-radius:6px;border:1px solid var(--line)}
.pends{display:flex;gap:8px;flex-wrap:wrap}
.pend{position:relative}
.pend img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.pend button{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px;cursor:pointer}
.drawer form textarea{flex:1;min-width:0;min-height:44px;max-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}

@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;right:0;left:auto;width:min(320px,88vw);z-index:30;transform:translateX(100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3);padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));justify-content:space-between;align-items:center;gap:10px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
  .topbar .t{font-family:var(--f-display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .main{padding-top:18px}
}
@media (max-width:640px){
  .drawer{inset:0;left:0;bottom:0;width:100%;max-height:none;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .two,.grid3,.grid2{grid-template-columns:minmax(0,1fr)}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lead{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side" id="side" aria-label="פרקי הקורס">
    <div class="brand">
      <div class="vu" id="vu" aria-hidden="true"></div>
      <h1>ערוץ מוזיקה מסונו</h1>
    </div>
    <div class="brand-sub">קורס מעשי: מסונו ליוטיוב, עד הכנסה ושכפול לערוצים נוספים</div>
    <div class="progress-line"><span>ההתקדמות שלי</span><span class="tnum" id="pct">0%</span></div>
    <div class="bar"><span id="pbar" style="width:0%"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-tools">
      <button class="btn sm" id="themeBtn" type="button">מצב לילה / יום</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="btn sm" id="menuBtn" type="button" aria-controls="side" aria-expanded="false">☰ פרקים</button>
      <span class="t" id="topTitle">ערוץ מוזיקה מסונו</span>
      <span class="tnum note" id="topPct">0%</span>
    </div>
    <div class="wrap" id="view"></div>
  </div>
</div>

<button class="btn pri fab" id="fab" type="button">שאלו את המדריך</button>
<div class="drawer" id="drawer" hidden>
  <header><b>המדריך האישי (AI)</b><div class="row"><button class="btn sm" id="tutorNew" type="button">שיחה חדשה</button><button class="btn sm" id="drawerClose" type="button">סגירה</button></div></header>
  <div class="chat" id="tutorChat"></div>
  <form id="tutorForm">
    <div class="pends" id="tutorPend" hidden></div>
    <div class="row"><button class="btn sm" id="tutorNext" type="button">מה הצעד הבא?</button><label class="btn sm" for="tutorImg" style="cursor:pointer">📷 צילום מסך</label><input id="tutorImg" type="file" accept="image/*" multiple hidden></div>
    <div class="row" style="flex-wrap:nowrap;align-items:flex-end"><textarea id="tutorIn" placeholder="כתבו שאלה, או שלחו צילום מסך…"></textarea>
    <button class="btn pri" type="submit" id="tutorSend">שליחה</button></div>
  </form>
</div>
<script>
// ===== כלי עזר לבניית איורי מסכים =====
// A(שמאל, למעלה, רוחב, גובה – באחוזים, מחלקה, תוכן, סגנון נוסף)
function A(l, t, w, h, cls, html, st) {
  return `<div class="${cls || ''}" style="position:absolute;left:${l}%;top:${t}%;width:${w}%;height:${h}%;${st || ''}">${html || ''}</div>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// איור מסך עם נקודות ממוספרות והסבר מתחת
function mock({ app, url, h, body, pins, cap, wide }) {
  const p = pins || [];
  return `<figure class="shot">
  <div class="frame${wide ? ' fscroll' : ''}" style="${wide ? 'overflow-x:auto' : ''}">
    <div class="chrome"><i></i><i></i><i></i><span class="url">${esc(url)}</span></div>

  set(k, v) { try { localStorage.setItem('sc_' + k, JSON.stringify(v)); } catch (e) { } }

async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); if (btn) { const o = btn.textContent; btn.textContent = 'הועתק ✓'; setTimeout(() => btn.textContent = o, 1400); } }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); if (btn) btn.textContent = 'הועתק ✓'; } catch (x) { if (btn) btn.textContent = 'סמנו והעתיקו ידנית'; }
    ta.remove();
  }
}
function outBlock(label, text, he) {

}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;

});

function renderNav() {
  // קבוצות לפי הסדר: כותרת חדשה בכל פעם שהקבוצה מתחלפת

  $('#pct').textContent = pct + '%'; $('#topPct').textContent = pct + '%'; $('#pbar').style.width = pct + '%';

}

function show(id) {
  const idx = Math.max(0, MODULES.findIndex(m => m.id === id));
  const m = MODULES[idx];
  const prev = MODULES[idx - 1], next = MODULES[idx + 1];
  const ck = checks[m.id] || [];

    </div>
    <div class="done-row">
      ${prev ? `<a class="btn" href="#${prev.id}">→ ${prev.title}</a>` : '<span></span>'}
      <button class="btn ${done.has(m.id) ? '' : 'pri'}" type="button" id="doneBtn">${done.has(m.id) ? 'סימון כלא הושלם' : 'סיימתי את הפרק ✓'}</button>
      ${next ? `<a class="btn" href="#${next.id}">${next.title} ←</a>` : '<span></span>'}

  $$('#nav a').forEach(a => a.classList.toggle('cur', a.dataset.id === m.id));

  $$('[data-ck]').forEach(cb => cb.addEventListener('change', () => {

  }));
  $('#doneBtn').onclick = () => {
    done.has(m.id) ? done.delete(m.id) : done.add(m.id);

    if (done.has(m.id) && next) location.hash = next.id; else show(m.id);

function aiErr(e) {
  if (e && e.he) return e.he; // הודעה מוכנה מהאפליקציה העצמאית
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled') return 'ה-AI לא זמין כאן. צריך לאשר לעמוד להשתמש ב-Claude (בחלון שנפתח), או לפתוח את הקורס מתוך Claude.';
  if (c === 'rate_limited') return 'יותר מדי בקשות כרגע. מחכים דקה ומנסים שוב.';
  if (c === 'session_expired') return 'צריך להתחבר מחדש ל-Claude.';
  if (c === 'refused') return 'ה-AI לא ענה על השאלה הזאת. נסו לנסח אחרת.';
  if (c === 'invalid_json') return 'התשובה הגיעה בפורמט לא תקין. לחצו שוב.';
  if (c === 'cancelled') return '';
  return 'משהו השתבש בחיבור ל-AI. נסו שוב.';
}

// גרף SVG פשוט: עמודות + קו + קו סף
function chartSVG({ labels, bars, line, thresholds, barLabel, lineLabel, fmtBar, fmtLine }) {
  const W = 640, H = 240, pl = 48, pr = 48, pt = 16, pb = 34;
  const n = labels.length, iw = W - pl - pr, ih = H - pt - pb, bw = iw / n;
  const maxB = Math.max(1, ...(bars || [0]));
  const maxL = Math.max(1, ...(line || [0]), ...((thresholds || []).map(t => t.v)));
  const yb = v => pt + ih - v / maxB * ih, yl = v => pt + ih - v / maxL * ih;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${barLabel || ''} ${lineLabel || ''}" style="direction:ltr">`;
  for (let i = 0; i <= 4; i++) { const yy = pt + ih * i / 4; s += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`; }
  if (bars) {
    bars.forEach((v, i) => { const h = pt + ih - yb(v); s += `<rect x="${pl + i * bw + bw * .15}" y="${yb(v)}" width="${bw * .7}" height="${Math.max(0, h)}" rx="2" fill="var(--meter)"><title>${labels[i]}: ${fmtBar ? fmtBar(v) : v}</title></rect>`; });
    s += `<text x="${pl - 6}" y="${pt + 8}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtBar ? fmtBar(maxB) : maxB}</text>`;
  }
  (thresholds || []).forEach(t => { s += `<line x1="${pl}" x2="${W - pr}" y1="${yl(t.v)}" y2="${yl(t.v)}" stroke="var(--bad)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${pl + 4}" y="${yl(t.v) - 5}" font-size="10.5" fill="var(--bad)">סף ${t.label}</text>`; });
  if (line) {
    const pts = line.map((v, i) => `${pl + i * bw + bw / 2},${yl(v)}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
    const li = line.length - 1; s += `<circle cx="${pl + li * bw + bw / 2}" cy="${yl(line[li])}" r="4" fill="var(--accent)"/>`;
    s += `<text x="${W - pr + 4}" y="${pt + 8}" font-size="11" fill="var(--accent)">${fmtLine ? fmtLine(maxL) : maxL}</text>`;
  }
  const step = Math.ceil(n / 8);
  labels.forEach((l, i) => { if (i % step === 0) s += `<text x="${pl + i * bw + bw / 2}" y="${H - 12}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`; });
  s += `<line x1="${pl}" x2="${W - pr}" y1="${pt + ih}" y2="${pt + ih}" stroke="var(--muted)" stroke-width="1"/></svg>`;
  s += `<div class="row note" style="gap:14px">${bars ? `<span><span style="display:inline-block;width:10px;height:10px;background:var(--meter);border-radius:2px"></span> ${barLabel}</span>` : ''}${line ? `<span><span style="display:inline-block;width:14px;height:3px;background:var(--accent)"></span> ${lineLabel}</span>` : ''}${(thresholds || []).length ? `<span><span style="display:inline-block;width:14px;border-top:2px dashed var(--bad)"></span> סף</span>` : ''}</div>`;
  return s;
}

    const v = {}; ids.forEach(k => v[k] = num($('#c_' + k, el)));
    v.scen = st.scen; store.set('calc', v);
    const N = Math.min(48, Math.max(6, Math.round(v.months)));
    const now = new Date(); const y0 = now.getFullYear(), m0 = now.getMonth() + 1; // מתחילים בחודש הבא
    const perMonth = v.vpw * 4.33, tail = Math.min(0.98, v.tail / 100);
    const views = [], hours = [], roll = [], subs = [], rev = [], labels = [], thr = [];
    let cum = 0, eligible = -1, approved = -1;
    for (let t = 0; t < N; t++) {
      let vv = 0;
      for (let k = 0; k <= t; k++) vv += perMonth * v.base * Math.pow(1 + v.growth / 100, k) * Math.pow(tail, t - k);
      views.push(vv); hours.push(vv * v.avd / 60);
      roll.push(hours.slice(Math.max(0, t - 11), t + 1).reduce((a, b) => a + b, 0));
      cum += vv * v.subs / 1000; subs.push(cum);
      const d = new Date(y0, m0 + t - 1, 1); labels.push(ymLabel(d.getFullYear(), d.getMonth()));
      const need = d < new Date(2027, 1, 1) ? 4000 : 8000; thr.push(need);
      if (eligible < 0 && cum >= 1000 && roll[t] >= need) { eligible = t; approved = t + 1; }
      rev.push(approved >= 0 && t >= approved ? vv * v.rpm / 1000 : 0);
    }
    const ch = Math.max(1, Math.round(v.ch));
    const totalRev = rev.reduce((a, b) => a + b, 0) * ch;
    const last = rev[N - 1] * ch;
    const net = totalRev - v.cost * N * ch;
    $('#c_stats', el).innerHTML = `
      <div class="stat"><b>${eligible >= 0 ? labels[eligible] : 'לא בטווח'}</b><span>עומדים בתנאי YPP${eligible >= 0 ? ` (חודש ${eligible + 1})` : ''}</span></div>
      <div class="stat"><b>$${fmt(last)}</b><span>הכנסה בחודש האחרון (₪${fmt(last * v.fx)})</span></div>
      <div class="stat"><b>$${fmt(totalRev)}</b><span>סה"כ הכנסה ב-${N} חודשים (₪${fmt(totalRev * v.fx)})</span></div>
      <div class="stat"><b style="color:${net < 0 ? 'var(--bad)' : 'var(--ok)'}">$${fmt(net)}</b><span>אחרי הוצאות (₪${fmt(net * v.fx)})</span></div>`;
    // הגרף הראשון נעצר כמה חודשים אחרי הזכאות, כדי שקו הסף יישאר קריא
    const cut = eligible >= 0 ? Math.min(N, eligible + 4) : N;
    const thrShown = thr.slice(0, cut);
    $('#c_chart1', el).innerHTML = `<h4 style="margin:4px 0">שעות צפייה ב-12 החודשים האחרונים מול הסף${cut < N ? ' (עד כמה חודשים אחרי הזכאות)' : ''}</h4>` + chartSVG({ labels: labels.slice(0, cut), line: roll.slice(0, cut), thresholds: [...(thrShown.includes(4000) ? [{ v: 4000, label: '4,000' }] : []), ...(thrShown.includes(8000) ? [{ v: 8000, label: '8,000 (מ-2.2027)' }] : [])], lineLabel: 'שעות צפייה מצטברות (12 חודשים)', fmtLine: x => fmt(x) });
    $('#c_chart2', el).innerHTML = `<h4 style="margin:4px 0">הכנסה חודשית משוערת${ch > 1 ? ` (${ch} ערוצים)` : ''}</h4>` + chartSVG({ labels, bars: rev.map(x => x * ch), barLabel: 'הכנסה חודשית ($)', fmtBar: x => '$' + fmt(x) });
    const subsAtElig = eligible >= 0 ? fmt(subs[eligible]) : fmt(subs[N - 1]);
    $('#c_note', el).innerHTML = `ההנחות: ${fmt(perMonth, 1)} סרטונים בחודש; כל סרטון ממשיך להביא צפיות שהולכות ופוחתות. מנויים ${eligible >= 0 ? 'בזמן הזכאות' : 'בסוף התקופה'}: ${subsAtElig}. אחרי הזכאות נוסף חודש לבדיקה. מ-1.2.2027 הסף לחדשים הוא 8,000 שעות (לפי דיווחים). הכנסה מוצגת רק מצפיות שאחרי הקבלה, כי צפיות ישנות לא מתוגמלות.`;
  };
  ids.forEach(k => $('#c_' + k, el).addEventListener('input', () => { st.scen = ''; $$('[data-scen]', el).forEach(b => b.setAttribute('aria-pressed', 'false')); calc(); }));
  $$('[data-scen]', el).forEach(b => b.onclick = () => {
    st.scen = b.dataset.scen; const s = SCEN[st.scen];
    Object.keys(s).forEach(k => $('#c_' + k, el).value = s[k]);
    $$('[data-scen]', el).forEach(x => x.setAttribute('aria-pressed', String(x === b))); calc();
  });
  calc();
};

  $$('[data-k]', el).forEach(b => b.onclick = () => {
    const k = b.dataset.k, v = b.dataset.v, arr = st[k]; const i = arr.indexOf(v);

    $$(`[data-k="${k}"]`, el).forEach(x => x.setAttribute('aria-pressed', String(arr.includes(x.dataset.v)))); build();
  });
  ['#p_bpm', '#p_extra', '#p_n'].forEach(s => $(s, el).addEventListener('input', build));
  build();

    if (!SAMPLE) { $('#p_ainote', el).textContent = 'ה-AI זמין רק כשפותחים את הקורס מתוך Claude.'; return; }

};

const TRACK_SAMPLE = [['2026-11', 3200, 410, 85, 0], ['2026-12', 7900, 1150, 160, 0], ['2027-01', 14800, 2300, 290, 0], ['2027-02', 22500, 3600, 410, 0], ['2027-03', 31000, 5100, 520, 31.4], ['2027-04', 38500, 6400, 610, 88.2]].map(r => ({ m: r[0], views: r[1], hours: r[2], subs: r[3], rev: r[4] }));
TOOLS.tracker = el => {
  let rows = [], sample = false, dbRef = null, saving = Promise.resolve();
  el.innerHTML = `<div class="tool">
    <div class="tool-h"><h3>המעקב שלי</h3><span class="tag" id="t_where">שמור בדפדפן הזה</span></div>
    <div class="row"><label class="btn pri" for="t_file" style="cursor:pointer">⬆ העלאת קובץ CSV מהסטודיו</label><input id="t_file" type="file" accept=".csv,text/csv" hidden>
      <div class="field" style="width:150px"><label for="t_now">מנויים כרגע</label><input id="t_now" type="number" min="0"></div>
      <div class="field" style="width:120px"><label for="t_fx">שער דולר</label><input id="t_fx" type="number" step="0.01" value="3.7"></div></div>
    <p class="note" id="t_msg"></p>
    <div class="grid4" id="t_stats"></div>
    <div id="t_chart"></div>
    <div class="tbl"><table><thead><tr><th>חודש</th><th>צפיות</th><th>שעות צפייה</th><th>מנויים חדשים</th><th>הכנסה ($)</th><th>RPM</th><th></th></tr></thead><tbody id="t_rows"></tbody></table></div>
    <form class="grid4" id="t_form" style="align-items:end">
      <div class="field"><label for="t_m">חודש</label><input id="t_m" type="month" required></div>
      <div class="field"><label for="t_v">צפיות</label><input id="t_v" type="number" min="0" required></div>
      <div class="field"><label for="t_h">שעות צפייה</label><input id="t_h" type="number" min="0" step="0.1" required></div>
      <div class="field"><label for="t_s">מנויים חדשים</label><input id="t_s" type="number" required></div>
      <div class="field"><label for="t_r">הכנסה ($)</label><input id="t_r" type="number" min="0" step="0.01" value="0"></div>
      <button class="btn" type="submit">הוספה / עדכון חודש</button>
    </form>
    <div class="row"><button class="btn sm" type="button" id="t_sample">הצגת נתוני דוגמה</button><button class="btn sm" type="button" id="t_clear">מחיקת כל הנתונים</button><span class="note" id="t_confirm"></span></div>
  </div>`;
  const meta = store.get('trackmeta', { now: '', fx: 3.7 });
  $('#t_now', el).value = meta.now; $('#t_fx', el).value = meta.fx;
  const persist = () => {
    if (sample) return;
    store.set('track', rows);
    if (dbRef) saving = saving.then(() => dbRef.set({ rows, now: $('#t_now', el).value, fx: num($('#t_fx', el)) })).catch(() => { $('#t_where', el).textContent = 'שמור בדפדפן הזה'; dbRef = null; });
  };
  const draw = () => {
    const R = [...rows].sort((a, b) => a.m.localeCompare(b.m));
    const fx = num($('#t_fx', el)) || 3.7;
    $('#t_rows', el).innerHTML = R.length ? R.map(r => `<tr><td class="tnum">${r.m}</td><td class="tnum">${fmt(r.views)}</td><td class="tnum">${fmt(r.hours, 1)}</td><td class="tnum">${fmt(r.subs)}</td><td class="tnum">${fmt(r.rev, 2)}</td><td class="tnum">${r.rev && r.views ? '$' + fmt(r.rev / r.views * 1000, 2) : '–'}</td><td>${sample ? '' : `<button class="btn sm" type="button" data-rm="${r.m}" aria-label="מחיקת ${r.m}">✕</button>`}</td></tr>`).join('')
      : `<tr><td colspan="7" class="note">עדיין אין נתונים. מעלים קובץ CSV מהסטודיו או מוסיפים חודש בטופס למטה. אפשר גם להציג נתוני דוגמה כדי לראות איך זה נראה.</td></tr>`;
    $$('[data-rm]', el).forEach(b => b.onclick = () => { rows = rows.filter(r => r.m !== b.dataset.rm); persist(); draw(); });
    const last12 = R.slice(-12);
    const hrs12 = last12.reduce((a, r) => a + r.hours, 0);
    const subsNow = num($('#t_now', el)) || R.reduce((a, r) => a + r.subs, 0);
    const rev = R.reduce((a, r) => a + r.rev, 0);
    const mon = R.filter(r => r.rev > 0), rpm = mon.length ? mon.reduce((a, r) => a + r.rev, 0) / mon.reduce((a, r) => a + r.views, 0) * 1000 : 0;
    const need = new Date() >= new Date(2027, 1, 1) ? 8000 : 4000;
    // תחזית: צמיחה ממוצעת ב-3 החודשים האחרונים
    let proj = '';
    if (R.length >= 3) {
      const l = R.slice(-3); const g = Math.pow(Math.max(1, l[2].views) / Math.max(1, l[0].views), 1 / 2);
      const gg = Math.min(1.5, Math.max(0.8, g)); let v = l[2].views, sum = 0;
      for (let i = 0; i < 6; i++) { v *= gg; sum += v * (rpm || 2.28) / 1000; }
      proj = `<div class="stat"><b>$${fmt(sum)}</b><span>תחזית ל-6 חודשים קדימה (₪${fmt(sum * fx)}), לפי צמיחה של ${fmt((gg - 1) * 100)}% בחודש ו-RPM ${rpm ? 'שלכם' : 'חציוני'}${rpm ? '' : ', אחרי קבלה'}</span></div>`;
    }
    $('#t_stats', el).innerHTML = R.length ? `
      <div class="stat"><b>$${fmt(rev, 2)}</b><span>הרווחתם עד היום (₪${fmt(rev * fx)})</span></div>
      <div class="stat"><b>${fmt(hrs12)} / ${fmt(need)}</b><span>שעות ב-12 החודשים האחרונים (${Math.min(100, Math.round(hrs12 / need * 100))}%)</span></div>
      <div class="stat"><b>${fmt(subsNow)} / 1,000</b><span>מנויים (${Math.min(100, Math.round(subsNow / 10))}%)</span></div>
      ${proj || `<div class="stat"><b>${rpm ? '$' + fmt(rpm, 2) : '–'}</b><span>RPM ממוצע</span></div>`}` : '';
    $('#t_chart', el).innerHTML = R.length ? chartSVG({ labels: R.map(r => r.m.slice(2).replace('-', '/')), bars: R.map(r => r.rev), line: R.map(r => r.hours), barLabel: 'הכנסה ($)', lineLabel: 'שעות צפייה בחודש', fmtBar: x => '$' + fmt(x), fmtLine: x => fmt(x) }) : '';
    $('#t_sample', el).textContent = sample ? 'חזרה לנתונים שלי' : 'הצגת נתוני דוגמה';
    $('#t_msg', el).innerHTML = sample ? '<span class="pill y">נתוני דוגמה</span> אלה לא הנתונים שלכם, ולא נשמרים.' : $('#t_msg', el).innerHTML.replace(/.*נתוני דוגמה.*/, '');
  };
  // ייבוא CSV
  const splitCSV = line => { const out = []; let cur = '', q = false; for (const ch of line) { if (ch === '"') q = !q; else if (ch === ',' && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(s => s.trim()); };
  $('#t_file', el).addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const txt = (await f.text()).replace(/^﻿/, '');
      const lines = txt.split(/\r?\n/).filter(Boolean); const head = splitCSV(lines[0]).map(h => h.toLowerCase());
      const col = re => head.findIndex(h => re.test(h));
      const ci = { d: col(/^(date|day|month|תאריך|חודש)/), v: col(/^views|צפיות/), h: col(/watch time.*hour|שעות/), s: col(/^subscribers|מנויים/), r: col(/estimated revenue|הכנסה/) };
      if (ci.d < 0 || (ci.v < 0 && ci.h < 0 && ci.r < 0)) throw new Error('cols');
      const agg = {};
      lines.slice(1).forEach(l => {
        const c = splitCSV(l); const d = c[ci.d] || ''; const m = d.match(/(\d{4})-(\d{2})/) || d.match(/([A-Za-z]{3})\s+(\d{4})/);
        if (!m) return; let key;
        if (/^\d{4}$/.test(m[1])) key = `${m[1]}-${m[2]}`; else { const mi = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'].indexOf(m[1].toLowerCase()); if (mi < 0) return; key = `${m[2]}-${String(mi + 1).padStart(2, '0')}`; }
        const n = i => i < 0 ? 0 : parseFloat(String(c[i] || '0').replace(/[^0-9.\-]/g, '')) || 0;
        const a = agg[key] || (agg[key] = { m: key, views: 0, hours: 0, subs: 0, rev: 0 });
        a.views += n(ci.v); a.hours += n(ci.h); a.subs += n(ci.s); a.rev += n(ci.r);
      });
      const got = Object.values(agg); if (!got.length) throw new Error('rows');
      sample = false;
      got.forEach(g => { const ex = rows.find(r => r.m === g.m); if (ex) { if (ci.v >= 0) ex.views = g.views; if (ci.h >= 0) ex.hours = g.hours; if (ci.s >= 0) ex.subs = g.subs; if (ci.r >= 0) ex.rev = g.rev; } else rows.push(g); });
      persist(); $('#t_msg', el).textContent = `יובאו ${got.length} חודשים מהקובץ.`; draw();
    } catch (err) { $('#t_msg', el).textContent = 'לא הצלחתי לקרוא את הקובץ. צריך קובץ CSV מ-Analytics ← Advanced mode, עם עמודת תאריך (Date) ועמודות כמו Views או Watch time (hours). אפשר גם להוסיף ידנית.'; }
    e.target.value = '';
  });
  $('#t_form', el).addEventListener('submit', e => {
    e.preventDefault(); if (sample) { sample = false; rows = store.get('track', []); }
    const r = { m: $('#t_m', el).value, views: num($('#t_v', el)), hours: num($('#t_h', el)), subs: num($('#t_s', el)), rev: num($('#t_r', el)) };
    rows = rows.filter(x => x.m !== r.m).concat(r); persist(); draw(); e.target.reset();
  });
  ['#t_now', '#t_fx'].forEach(s => $(s, el).addEventListener('change', () => { store.set('trackmeta', { now: $('#t_now', el).value, fx: num($('#t_fx', el)) }); persist(); draw(); }));
  $('#t_sample', el).onclick = () => { sample = !sample; rows = sample ? TRACK_SAMPLE.map(x => ({ ...x })) : store.get('track', []); draw(); };
  let armed = false;
  $('#t_clear', el).onclick = () => {
    if (!armed) { armed = true; $('#t_confirm', el).textContent = 'ללחוץ שוב כדי למחוק הכול.'; setTimeout(() => { armed = false; $('#t_confirm', el).textContent = ''; }, 4000); return; }
    armed = false; sample = false; rows = []; persist(); $('#t_confirm', el).textContent = 'נמחק.'; draw();
  };
  rows = store.get('track', []); draw();
  // שמירה בחשבון (אם זמין): פרטי לכל צופה
  (async () => {
    try {
      if (!window.claude || !claude.use) return;
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db || !user) return; const uid = await user.id(); if (!uid) return;
      dbRef = db.doc('data/users/' + uid + '/tracker');
      const snap = await dbRef.get();
      if (snap.exists) { const d = snap.data(); if (Array.isArray(d.rows) && !sample) { rows = d.rows.map(r => ({ ...r })); if (d.now != null) $('#t_now', el).value = d.now; if (d.fx) $('#t_fx', el).value = d.fx; store.set('track', rows); draw(); } }
      $('#t_where', el).textContent = 'שמור בחשבון שלכם';
    } catch (e) { dbRef = null; }
  })();
};
boot();
</script>
