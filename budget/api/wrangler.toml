name = "bayit-budget-api"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# בקשות שינוי מהאפליקציה נפתחות כ-issues כאן (הטוקן: הסוד GITHUB_TOKEN, מ-POINTS_GITHUB_TOKEN)
GITHUB_REPO = "guygitter-bot/red-grass"
# האתרים שמותר להם לפנות לשרת (* = כל תת-כתובת, למקרה ש-Cloudflare Pages מוסיף סיומת לשם)
ALLOWED_ORIGINS = "https://bayit-budget.pages.dev,https://*.bayit-budget.pages.dev,http://localhost:5173,http://localhost:4173"

# כל התקציב – אובייקט אחד ("main")
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Budget"]
