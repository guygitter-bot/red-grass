<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:K;src:url(file:///root/.fonts/Karantina-Bold.ttf);font-weight:700}
@font-face{font-family:F;src:url("file:///root/.fonts/Fredoka%255Bwdth,wght%255D.ttf");font-weight:300 700}
@font-face{font-family:R;src:url("file:///root/.fonts/Rubik%255Bwght%255D.ttf");font-weight:300 900}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
*{box-sizing:border-box}
.blk{position:absolute;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0}
.chip{font:800 46px/1 R;color:#111;background:#FFE14D;padding:14px 30px 12px;border-radius:999px;
  box-shadow:0 6px 0 #111;letter-spacing:.5px;white-space:nowrap}
.main{font:700 132px/0.92 K;color:#fff;padding:18px 40px 8px;border-radius:26px;white-space:nowrap;
  background:linear-gradient(100deg,#FF2E88,#FF7A18);box-shadow:0 10px 0 #111, 0 18px 40px rgba(0,0,0,.35);
  text-shadow:0 4px 0 rgba(0,0,0,.25)}
.main.big{font-size:190px;padding:20px 44px 6px}
.sub{font:800 52px/1 R;color:#fff;background:#111;padding:14px 30px;border-radius:18px;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.35)}
.sub b{color:#FFE14D}
.arrow{width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;
  border-top:40px solid #FFE14D;filter:drop-shadow(0 5px 0 #111);margin-top:4px}
/* פתיחה */
#intro{top:70px;left:0;right:0}
#intro .main{font-size:120px}
/* סיום */
#outro{left:30px;right:30px;top:30px;align-items:stretch;gap:0;
  background:rgba(17,17,17,.92);border-radius:36px;padding:22px 22px 26px;border:5px solid #FFE14D;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
#outro h2{margin:0 0 14px;text-align:center;font:700 96px/1 K;
  background:linear-gradient(100deg,#FF2E88,#FF7A18,#FFE14D);-webkit-background-clip:text;color:transparent}
.rows{display:flex;gap:14px}
.row{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 8px;border-radius:22px;background:rgba(255,255,255,.08);text-align:center}
.row .d{text-align:center;font:800 32px/1.1 R;color:#111;background:#FFE14D;border-radius:18px;padding:12px 6px}
.row .t{font:700 38px/1.15 R;color:#fff}
.row .t small{display:block;margin-top:6px;font:500 30px/1.2 R;color:#FFB36B}
.guys{width:100%;text-align:center;font:700 200px/1 F;letter-spacing:2px;white-space:nowrap;
  background:linear-gradient(180deg,#FFE14D,#FF7A18 55%,#FF2E88);-webkit-background-clip:text;color:transparent;
  -webkit-text-stroke:6px #111;paint-order:stroke fill;filter:drop-shadow(0 10px 0 #111) drop-shadow(0 18px 30px rgba(0,0,0,.3))}

.cal{width:1em;height:1em;vertical-align:-0.14em;margin-left:10px}
.R{right:30px;align-items:flex-start}
.L{left:30px;align-items:flex-end}
.C{left:0;width:1080px;align-items:center}
</style></head><body>

<div class="blk C" id="guys" style="top:60px"><div class="guys">The guys</div></div>

<div class="blk R" id="t1" style="top:50px">
  <div class="chip"><svg class="cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="#FF2E88" stroke="#111" stroke-width="2"/><rect x="3" y="5" width="18" height="5" rx="2" fill="#111"/><rect x="7" y="2.5" width="2.4" height="5" rx="1.2" fill="#111"/><rect x="14.6" y="2.5" width="2.4" height="5" rx="1.2" fill="#111"/></svg>31.10</div>
  <div class="main big" style="font-size:150px">13:30</div>
</div>

<div class="blk L" id="j" style="top:50px">
  <div class="main">ג'אסר א-זארקא</div>
</div>

<div class="blk L" id="b2" style="top:40px">
  <div class="chip"><svg class="cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="#FF2E88" stroke="#111" stroke-width="2"/><rect x="3" y="5" width="18" height="5" rx="2" fill="#111"/><rect x="7" y="2.5" width="2.4" height="5" rx="1.2" fill="#111"/><rect x="14.6" y="2.5" width="2.4" height="5" rx="1.2" fill="#111"/></svg>יום חמישי · 5.11</div>
  <div class="main">פסטיבל המרפסות</div>
  <div class="sub">📍 <b>טבעון</b></div>
</div>

<div class="blk C" id="t2" style="top:50px">
  <div class="chip">פסטיבל המרפסות · טבעון</div>
  <div class="main big">20:30</div>
</div>

<div class="blk R" id="b4" style="top:40px">
  <div class="chip"><svg class="cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="#FF2E88" stroke="#111" stroke-width="2"/><rect x="3" y="5" width="18" height="5" rx="2" fill="#111"/><rect x="7" y="2.5" width="2.4" height="5" rx="1.2" fill="#111"/><rect x="14.6" y="2.5" width="2.4" height="5" rx="1.2" fill="#111"/></svg>יום שישי · 6.11</div>
  <div class="main">פסטיבל דוקואביב</div>
  <div class="sub">📍 <b>מעלות</b></div>
</div>

<div class="blk R" id="t3" style="top:50px">
  <div class="chip">דוקואביב · מעלות</div>
  <div class="main big" style="font-size:150px">18:00</div>
</div>

<div class="blk" id="outro">
  <h2>נתראה בהופעות!</h2>
  <div class="rows">
  <div class="row"><div class="d">31.10</div><div class="t">ג'אסר א-זארקא<small>בשעה 13:30</small></div></div>
  <div class="row"><div class="d">חמישי · 5.11</div><div class="t">פסטיבל המרפסות<small>טבעון · 20:30</small></div></div>
  <div class="row"><div class="d">שישי · 6.11</div><div class="t">פסטיבל דוקואביב<small>מעלות · 18:00</small></div></div>
  </div>
</div>

<script>
// זמני ההופעה של כל כיתוב בשניות
const SEG = {guys:[3.0,6.2], t1:[13.0,16.2], j:[18.0,21.2], b2:[32.0,35.4], t2:[36.0,39.2], b4:[46.0,49.6], t3:[60.0,62.8], outro:[63.0,67.8]};
const anims = [];
function add(el, kf, start, dur, opts={}){
  const a = el.animate(kf, {duration:dur*1000, delay:start*1000, fill:'both', easing:'linear', ...opts});
  a.pause(); anims.push(a);
}
const pop = 'cubic-bezier(.2,1.6,.4,1)';
for (const [id,[a,b]] of Object.entries(SEG)){
  const el = document.getElementById(id), d = b-a, inT = 0.45/d, outT = 1-0.3/d;
  const fromY = id==='outro' ? 'translateY(-120px)' : 'translateY(-40px) scale(.6) rotate(-4deg)';
  add(el,[{opacity:0,transform:fromY,easing:pop},{opacity:1,transform:'none',offset:inT},
          {opacity:1,transform:'none',offset:outT,easing:'ease-in'},{opacity:0,transform:'scale(.85)'}], a, d);
  // כל חלק נכנס קצת אחרי הקודם
  [...el.children].forEach((c,i)=>{
    if (c.classList.contains('arrow')){
      add(c,[{transform:'translateY(0)'},{transform:'translateY(16px)'},{transform:'translateY(0)'}], a+0.4, 0.5, {iterations:Math.ceil(d/0.5), easing:'ease-in-out'});
      return;
    }
    add(c,[{opacity:0,transform:'translateX(-60px) scale(.8)',easing:pop},{opacity:1,transform:'none'}], a+0.08*i, 0.4);
  });
  // ברק קטן על הכיתוב הראשי
  const m = el.querySelector('.main');
  if (m) add(m,[{filter:'brightness(1)'},{filter:'brightness(1.6)'},{filter:'brightness(1)'}], a+0.35, 0.35);
}
window.SEG = SEG;
window.setT = t => { for (const a of anims) a.currentTime = t*1000; };
</script></body></html>
