name = "sidra-2k-api"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# האתרים שמותר להם לפנות לשרת (* = כל תת-כתובת, למקרה ש-Cloudflare Pages מוסיף סיומת לשם)
ALLOWED_ORIGINS = "https://sidra-2k.pages.dev,https://*.sidra-2k.pages.dev,http://localhost:5173,http://localhost:4173"

# כל הסדרה – אובייקט אחד ("main")
[[durable_objects.bindings]]
name = "SERIES"
class_name = "Series"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Series"]
