name = "mat-kon-api"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# האתרים שמותר להם לפנות לשרת (האפליקציה ב-Cloudflare Pages ופיתוח מקומי)
ALLOWED_ORIGINS = "https://mat-kon.pages.dev" # לפיתוח מקומי: ALLOWED_ORIGINS בקובץ .dev.vars
# כמה מתכונים משתמש שהוזמן מקבל בחינם לפני שצריך מנוי
FREE_RECIPES = "10"
# קישור לדף התשלום (למשל דף מוצר בסליקה). ריק = "פנו לבעל האפליקציה"
PAYMENT_URL = ""

# ספרי המתכונים: "book" של בעל האפליקציה, ו-"user:<id>" לכל משתמש שהוזמן
[[durable_objects.bindings]]
name = "BOOK"
class_name = "RecipeBook"

# משתמשים שהוזמנו: הזמנות, הרשמה, כניסה ומכסה
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RecipeBook"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]

# גיבוי לילי (backup.js): כל הספרים לדלי R2 פרטי, 30 הימים האחרונים. הדלי נוצר פעם אחת בחשבון Cloudflare
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "mat-kon-backups"

[triggers]
crons = ["17 1 * * *"] # כל לילה ב-01:17 UTC (בערך 4 בבוקר בישראל)

# מפתח ה-API הוא סוד, לא כאן: ANTHROPIC_API_KEY (נקבע אוטומטית מ-GitHub, ראו .github/workflows/mat-kon.yml)
