name = "mat-kon-api"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# האתרים שמותר להם לפנות לשרת (האפליקציה ב-Cloudflare Pages ופיתוח מקומי)
ALLOWED_ORIGINS = "https://mat-kon.pages.dev,http://localhost:5173,http://localhost:4173"

# ספר המתכונים המשותף (Durable Object עם SQLite, כלול בתוכנית החינמית)
[[durable_objects.bindings]]
name = "BOOK"
class_name = "RecipeBook"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RecipeBook"]

# המפתח וקוד הגישה הם סודות, לא כאן:
#   ANTHROPIC_API_KEY, ACCESS_CODE  (נקבעים אוטומטית מ-GitHub, ראו .github/workflows/mat-kon.yml)
