name: tsevet smart edit

# עריכה חכמה בשביל הבוט 🎬 באפליקציית "צוות" (tsevet/api/render.js, op = smart_edit).
# הבעלים אישר בכפתור -> השרת שולח אות עם מזהה העבודה. כאן מתקינים את הסקיל שנבחר
# (ghost-editor, Claude Shorts, ffmpeg-skill – בגרסה קבועה), ו-Claude Code עורך את הסרטון ומעלה אותו לשיחה.
# המאגר ציבורי: הבריף והקבצים לא מודפסים, והפלט של Claude נשמר לקובץ ולא ללוג (tsevet/render/smart.py).
# הטוקן של השרת ניתן רק לשלבי ההורדה וההעלאה – לא לשלב של Claude.
on:
  repository_dispatch:
    types: [tsevet-smartedit]

permissions:
  contents: read

concurrency:
  group: tsevet-smartedit-${{ github.event.client_payload.id }}
  cancel-in-progress: false

env:
  TSEVET_API: https://tsevet-api.guygitter.workers.dev
  JOB_ID: ${{ github.event.client_payload.id }}
  # גרסאות קבועות של הסקילים (לעדכן בכוונה, אחרי בדיקה)
  GHOST_EDITOR_SHA: d71bdb62d8e8280f05d6271bb72610ca83d38d8a
  SHORTS_SHA: a369fad9d84287edbb8fa3ab515f268e770f683b
  FFMPEG_SKILL_VERSION: 3.15.1
  # OpenMontage (calesthio/OpenMontage, AGPLv3) – אולפן וידאו שלם; רק המסלולים החינמיים, בלי מפתחות
  OPENMONTAGE_SHA: 2e003e65fa99a0f329478a2c1cdcf26bc481933a
  # rea-video (JuneYaooo/rea-video, Apache-2.0) – פירוק סרטון לדוח (לא עריכה)
  REA_VIDEO_SHA: 9572a00bbccf0baa272983893b5c0c3589875088

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check the request
        env:
          TOKEN: ${{ secrets.POINTS_GITHUB_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::Missing secret POINTS_GITHUB_TOKEN"; exit 1; }
          [ -n "$KEY" ] || { echo "::error::Missing secret ANTHROPIC_API_KEY"; exit 1; }
          printf '%s' "$JOB_ID" | grep -Eq '^[a-z0-9]{8,32}$' || { echo "::error::Bad id"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download the job
        id: job
        env:
          TSEVET_TOKEN: ${{ secrets.POINTS_GITHUB_TOKEN }}
        run: python3 tsevet/render/smart.py prepare "$JOB_ID"
      - name: Editing basics (ffmpeg, fonts, Claude Code)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji libfribidi0 libharfbuzz0b rsync > /dev/null
          npm install -g --silent @anthropic-ai/claude-code
          mkdir -p ~/.claude/skills
      - name: Install ffmpeg-skill
        if: steps.job.outputs.tool == 'ffmpeg' || steps.job.outputs.tool == 'auto'
        run: npx -y "ffmpeg-skill@${FFMPEG_SKILL_VERSION}" --claude
      - name: Install ghost-editor
        if: steps.job.outputs.tool == 'ghost-editor' || steps.job.outputs.tool == 'auto'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          d=~/.claude/skills/ghost-editor
          git clone -q https://github.com/kurbaitaev/ghost-editor "$d"
          git -C "$d" checkout -q "$GHOST_EDITOR_SHA"
          pip install --quiet openai-whisper numpy opencv-python pillow google-genai
          python3 "$d/scripts/library_restore.py" > /dev/null || echo "::warning::sound library not complete"
          # Gemini (בדיקת B-roll) – רק אם יש מפתח; הקובץ לא נכנס ל-git
          if [ -n "$GEMINI_API_KEY" ]; then printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > "$d/.env"; fi
          bash "$d/scripts/doctor.sh" | grep -E "MISS|missing" || true
      - name: Install Claude Shorts
        if: steps.job.outputs.tool == 'shorts'
        run: |
          d=~/.claude/skills/shorts
          git clone -q https://github.com/AgriciDaniel/claude-shorts.git "$d"
          git -C "$d" checkout -q "$SHORTS_SHA"
          (cd "$d" && bash setup.sh > /dev/null)
      - name: Install OpenMontage
        if: steps.job.outputs.tool == 'montage'
        run: |
          d=~/openmontage
          git clone -q https://github.com/calesthio/OpenMontage.git "$d"
          git -C "$d" checkout -q "$OPENMONTAGE_SHA"
          python3 -m venv "$d/.venv"
          "$d/.venv/bin/python" -m pip install --quiet 'pip>=26.2.2'
          "$d/.venv/bin/python" -m pip install --quiet -r "$d/requirements.txt"
          "$d/.venv/bin/python" -m pip install --quiet piper-tts || echo "::warning::piper-tts not installed"
          (cd "$d/remotion-composer" && npm install --silent --no-audit --no-fund) || echo "::warning::remotion not installed"
          [ -f "$d/.env.example" ] && cp "$d/.env.example" "$d/.env" || true
      - name: Install rea-video
        if: steps.job.outputs.tool == 'rea'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          d=~/rea-video
          git clone -q https://github.com/JuneYaooo/rea-video.git "$d"
          git -C "$d" checkout -q "$REA_VIDEO_SHA"
          python3 -m venv "$d/.venv"
          "$d/.venv/bin/python" -m pip install --quiet "$d[ocr,asr]"
          # rapidocr מביא opencv-python שדורס את ה-headless (כמו ב-install_skill.sh שלהם)
          if "$d/.venv/bin/python" -m pip show opencv-python > /dev/null 2>&1; then
            "$d/.venv/bin/python" -m pip uninstall -y -q opencv-python
            "$d/.venv/bin/python" -m pip install --quiet --force-reinstall --no-deps "opencv-python-headless>=4.8,<5"
          fi
          sudo ln -sf "$d/.venv/bin/rea-video" /usr/local/bin/rea-video
          ln -sfn "$d/skills/rea-video" ~/.claude/skills/rea-video
          # Gemini (רואה ושומע את הסרטון – פירוק מדויק יותר) – רק אם יש מפתח; הקובץ מחוץ למאגר
          if [ -n "$GEMINI_API_KEY" ]; then printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > ~/.rea.env; chmod 600 ~/.rea.env; fi
          rea-video --help > /dev/null
      - name: Claude edits the video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sonnet מבצע, Fable 5.2 יועץ (.claude/skills/fable-advisor)
          MODEL: ${{ vars.TSEVET_SMART_MODEL || 'claude-sonnet-5-5' }}
          ADVISOR: ${{ vars.TSEVET_SMART_ADVISOR || 'claude-fable-5-2' }}
          MAX_USD: ${{ vars.TSEVET_SMART_MAX_USD || '12' }}
        working-directory: .smart
        run: |
          claude -p "$(cat prompt.txt)" \
            --model "$MODEL" \
            $([ "$ADVISOR" = off ] && echo '--settings {"advisorModel":""}' || echo "--advisor $ADVISOR") \
            --max-turns 250 \
            --max-budget-usd "$MAX_USD" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash,Task" \
            --add-dir ~/.claude/skills \
            $([ -d ~/openmontage ] && echo "--add-dir $HOME/openmontage") \
            $([ -d ~/rea-video ] && echo "--add-dir $HOME/rea-video") \
            --output-format json > claude.json 2>/dev/null || echo "::warning::Claude exited with an error"
      - name: Upload the result
        if: always() && steps.job.outcome == 'success'
        env:
          TSEVET_TOKEN: ${{ secrets.POINTS_GITHUB_TOKEN }}
        run: python3 tsevet/render/smart.py finish "$JOB_ID"
