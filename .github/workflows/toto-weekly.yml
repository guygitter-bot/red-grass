name: Weekly Toto 16

on:
  # Runs only when started by hand: Actions -> Weekly Toto 16 -> Run workflow
  # (the site's "הפעל את הסוכן" button links there).
  workflow_dispatch:
    inputs:
      manual_matches:
        description: "Optional: 16 matches 'home - away' separated by ';' (skips finding the form)"
        required: false
        default: ""
      manual_first_kickoff:
        description: "With manual matches: first kickoff, Israel time (e.g. 2026-10-03T19:30). The form closes 6 minutes earlier"
        required: false
        default: ""
      manual_round:
        description: "Optional round number for manual matches"
        required: false
        default: ""
      dry_run:
        description: "Build the ticket without sending WhatsApp/email"
        type: boolean
        default: false
      demo:
        description: "Demo data, no API calls (tests the pipeline and the site)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["toto_predictor/web/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: toto-weekly
  cancel-in-progress: false

jobs:
  predict:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r toto_predictor/requirements.txt
      - name: Find form, research and build ticket
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TOTO_EMAIL_TO: ${{ vars.TOTO_EMAIL_TO }}
          TOTO_MODEL: ${{ vars.TOTO_MODEL }}
          TOTO_RESEARCH_MODEL: ${{ vars.TOTO_RESEARCH_MODEL }}
          TOTO_EFFORT: ${{ vars.TOTO_EFFORT }}
          TOTO_MAX_SEARCHES: ${{ vars.TOTO_MAX_SEARCHES }}
          TOTO_MAX_FETCHES: ${{ vars.TOTO_MAX_FETCHES }}
          TOTO_SITE_URL: ${{ vars.TOTO_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          MANUAL_MATCHES: ${{ inputs.manual_matches }}
          MANUAL_ROUND: ${{ inputs.manual_round }}
          MANUAL_FIRST_KICKOFF: ${{ inputs.manual_first_kickoff }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          DEMO: ${{ inputs.demo && '1' || '0' }}
        run: python toto_predictor/run_weekly.py
      - name: Commit ticket data
        if: ${{ !inputs.demo }}
        run: |
          git config user.name "toto-bot"
          git config user.email "toto-bot@users.noreply.github.com"
          git add toto_predictor/data
          git diff --cached --quiet || git commit -m "Toto 16 ticket $(date -u +%Y-%m-%d)"
          git push

  deploy:
    needs: predict
    if: ${{ always() && (needs.predict.result == 'success' || needs.predict.result == 'skipped') }}
    uses: ./.github/workflows/pages-deploy.yml
    with:
      ref: ${{ github.ref_name }}
