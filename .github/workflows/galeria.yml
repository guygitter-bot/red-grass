name: galeria

# גלריה מסודרת (galeria/): סידור הגלריה בטלפון אנדרואיד.
#   galeria/web    – המסכים (React). בדפדפן: גלריה לדוגמה → https://galeria-app.pages.dev
#   galeria/mobile – אפליקציית האנדרואיד (Capacitor + GalleryPlugin.java) שעוטפת את web/dist
# אחרי מיזוג ל-main: האפליקציה (APK) עולה לאתר להורדה ישירה → https://galeria-app.pages.dev/galeria.apk
on:
  push:
    branches: [main]
    paths: ["galeria/**", ".github/workflows/galeria.yml"]
  pull_request:
    paths: ["galeria/**", ".github/workflows/galeria.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galeria-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: App tests and build
        working-directory: galeria/web
        run: |
          npm ci
          npm test
          npm run build

      - name: Copy into the Android project
        working-directory: galeria/mobile
        run: |
          npm ci
          npx cap sync android

      - name: Android app (APK for direct install)
        working-directory: galeria/mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Put the APK on the site
        run: |
          APK=galeria/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          # Cloudflare Pages: עד 25MB לקובץ
          if [ "$(stat -c %s "$APK")" -lt 26000000 ]; then cp "$APK" galeria/web/dist/galeria.apk; else echo "::warning::APK too big for Pages"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: galeria-android-${{ github.run_number }}
          path: galeria/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create the Pages project (first run only)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: galeria/web
          wranglerVersion: "4.146.0"
          command: pages project create galeria-app --production-branch=main
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: galeria/web
          wranglerVersion: "4.146.0"
          command: pages deploy dist --project-name=galeria-app --branch=main --commit-dirty=true
      - name: Summary
        if: github.event_name != 'pull_request'
        run: echo "Published: https://galeria-app.pages.dev (APK: https://galeria-app.pages.dev/galeria.apk)" >> "$GITHUB_STEP_SUMMARY"
