name: tsevet

# צוות (tsevet/): צוות בוטים – אפליקציה משלו, וגם ב-Telegram
#   api -> Cloudflare Worker "tsevet-api" (הבוטים, Durable Object אחד, Claude; קבצים בדלי R2 "tsevet-files")
#   web -> Cloudflare Pages "tsevet-ai" -> https://tsevet-ai.pages.dev
# עריכת הווידאו עצמה רצה ב-tsevet-render.yml.
# עולה גם כשה-README של אחת האפליקציות משתנה – כדי שהבוטים יכירו את הגרסה העדכנית.
on:
  push:
    branches: [main]
    paths:
      - "tsevet/**"
      - ".github/workflows/tsevet.yml"
      - "seder/README.md"
      - "bisim/README.md"
      - "ma_hashir/README.md"
      - "harochshim/README.md"
      - "mat_kon/README.md"
      - "ai_maagar/README.md"
      - "eretz_ir/README.md"
      - "rock_city/README.md"
  pull_request:
    paths: ["tsevet/**", ".github/workflows/tsevet.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsevet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Server tests
        working-directory: tsevet/api
        run: |
          npm ci
          node build-apps.mjs
          npm test
      - name: App tests and build
        working-directory: tsevet/web
        run: |
          npm ci
          npm test
          npm run build

  api:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TG_CREATIVE: ${{ secrets.TG_CREATIVE_TOKEN }}
          TG_CAMPAIGNS: ${{ secrets.TG_CAMPAIGNS_TOKEN }}
          OWNER_CODE: ${{ secrets.TEAM_OWNER_CODE }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "$TG_CREATIVE" ] || missing="$missing TG_CREATIVE_TOKEN"
          [ -n "$TG_CAMPAIGNS" ] || missing="$missing TG_CAMPAIGNS_TOKEN"
          [ -n "$OWNER_CODE" ] || missing="$missing TEAM_OWNER_CODE"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see tsevet/README.md)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: tsevet/api
        run: |
          npm ci
          node build-apps.mjs
      - name: Create the files bucket (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tsevet/api
          wranglerVersion: "4.146.0"
          command: r2 bucket create tsevet-files
      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TG_CREATIVE_TOKEN: ${{ secrets.TG_CREATIVE_TOKEN }}
          TG_CAMPAIGNS_TOKEN: ${{ secrets.TG_CAMPAIGNS_TOKEN }}
          TEAM_OWNER_CODE: ${{ secrets.TEAM_OWNER_CODE }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tsevet/api
          wranglerVersion: "4.146.0"
          secrets: |
            ANTHROPIC_API_KEY
            TG_CREATIVE_TOKEN
            TG_CAMPAIGNS_TOKEN
            TEAM_OWNER_CODE
      - name: GitHub token for video editing (optional)
        working-directory: tsevet/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_RENDER_TOKEN: ${{ secrets.POINTS_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_RENDER_TOKEN" ]; then
            echo "::notice::POINTS_GITHUB_TOKEN is not set; video editing in the app stays off"
            exit 0
          fi
          printf '%s' "$GH_RENDER_TOKEN" | npx --yes wrangler@4.146.0 secret put GITHUB_TOKEN
      - name: Google key for video generation (optional)
        working-directory: tsevet/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI" ]; then
            echo "::notice::GEMINI_API_KEY is not set; video generation in the app stays off"
            exit 0
          fi
          printf '%s' "$GEMINI" | npx --yes wrangler@4.146.0 secret put GEMINI_API_KEY
      - name: Connect the bots to Telegram
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          TOKEN: ${{ secrets.TG_CREATIVE_TOKEN }}
        run: |
          URL="${URL:-https://tsevet-api.guygitter.workers.dev}"
          key=$(printf 'tsevet:setup:%s' "$TOKEN" | sha256sum | cut -c1-48)
          for i in 1 2 3 4 5; do
            if out=$(curl -sf -X POST -H "x-setup: $key" "$URL/setup"); then
              echo "Bots: $out" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Could not connect the bots to Telegram"
          exit 1

  web:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: tsevet/web
        run: |
          npm ci
          npm run build
      - name: Create the Pages project (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tsevet/web
          wranglerVersion: "4.146.0"
          command: pages project create tsevet-ai --production-branch=main
      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tsevet/web
          wranglerVersion: "4.146.0"
          command: pages deploy dist --project-name=tsevet-ai --branch=main --commit-dirty=true
      - name: Summary
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          echo "Published: https://tsevet-ai.pages.dev ($URL)" >> "$GITHUB_STEP_SUMMARY"
