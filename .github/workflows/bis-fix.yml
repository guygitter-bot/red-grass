name: Bis fix requests

# "שלח תיקון" באפליקציה פותח issue עם התווית bis-fix (דרך השרת bis-api, בשם בעל המאגר).
# Claude Code קורא את הבקשה (וצילום המסך), מתקן בתוך points_tracker/ ומריץ בדיקות.
# אם הכול עובר: PR ל-staging שממוזג אוטומטית -> https://staging.bis-app.pages.dev,
# תגובה ב-issue והודעת וואטסאפ לבעל האפליקציה. לאפליקציה הרגילה (main) עולה רק אחרי אישור שלך.
# בקשה לא ברורה -> שאלה בתגובה. תגובה שלך ב-issue מריצה שוב עם כל השיחה.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: bis-fix-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  fix:
    # רק issues שבעל המאגר פתח (השרת פותח אותם בשמו), ורק תגובות של בעל המאגר
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'bis-fix') &&
       github.event.issue.user.login == github.repository_owner &&
       !github.event.issue.pull_request &&
       ((github.event_name == 'issues' && github.event.label.name == 'bis-fix') ||
        (github.event_name == 'issue_comment' && github.event.comment.user.login == github.repository_owner)))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check secrets
        env:
          PAT: ${{ secrets.POINTS_GITHUB_TOKEN }}
          KEY: ${{ secrets.POINTS_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$PAT" ] || { echo "::error::Missing secret POINTS_GITHUB_TOKEN (see points_tracker/README.md)"; exit 1; }
          [ -n "$KEY" ] || { echo "::error::Missing secret ANTHROPIC_API_KEY"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          # Claude runs without the push token; only the publish step below gets it
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: points_tracker/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          (cd points_tracker/web && npm ci)
          pip install -r points_tracker/requirements.txt
          npm install -g @anthropic-ai/claude-code
      - name: Read the request
        env:
          ADMIN_CODE: ${{ secrets.POINTS_ADMIN_CODE }}
        run: python points_tracker/fixbot/fixbot.py prepare
      - name: Claude fixes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.POINTS_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.BIS_FIX_MODEL || 'claude-opus-5-5' }}
        run: |
          claude -p "$(cat .fix/prompt.txt)" \
            --model "$MODEL" \
            --max-turns 80 \
            --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(cd:*),Bash(ls:*),Bash(npm test:*),Bash(npm run build:*),Bash(npx vitest:*),Bash(node --test:*),Bash(python -m unittest:*),Bash(git diff:*),Bash(git status:*)" \
            --output-format json > .fix/claude.json || echo "::warning::Claude exited with an error"
          tail -c 2000 .fix/claude.json || true
      - name: Check the result
        id: check
        run: python points_tracker/fixbot/fixbot.py check
      - name: Tests
        id: tests
        if: steps.check.outputs.status == 'fixed'
        run: |
          (cd points_tracker/web && npm test && npm run build)
          python -m unittest discover -s points_tracker/tests -t .
          (cd points_tracker/proxy && npm test)
      - name: Publish to staging
        id: publish
        if: steps.check.outputs.status == 'fixed'
        env:
          # a personal token, so the merge into staging triggers the staging deploy
          GH_TOKEN: ${{ secrets.POINTS_GITHUB_TOKEN }}
        run: |
          branch="bis-fix/${ISSUE}-${GITHUB_RUN_ID}"
          git config user.name "bis-fix"
          git config user.email "bis-fix@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A -- points_tracker
          git commit -F .fix/commit.txt
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          url=$(gh pr create --base staging --head "$branch" --title "$(head -n1 .fix/commit.txt)" --body-file .fix/pr.md)
          gh pr merge "$url" --merge --delete-branch
          echo "pr=$url" >> "$GITHUB_OUTPUT"
      - name: Report
        if: always()
        env:
          STATUS: ${{ steps.check.outputs.status }}
          TESTS: ${{ steps.tests.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          PR: ${{ steps.publish.outputs.pr }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python points_tracker/fixbot/fixbot.py report
