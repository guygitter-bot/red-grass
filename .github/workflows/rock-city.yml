name: rock-city

# רוק סיטי – מערכת שעות (rock_city/):
#   api -> Cloudflare Worker "rock-city-api" (כל הנתונים, Durable Object אחד לבית הספר)
#   web -> Cloudflare Pages "rock-city-school" -> https://rock-city-school.pages.dev
on:
  push:
    branches: [main]
    paths: ["rock_city/**", ".github/workflows/rock-city.yml"]
  pull_request:
    paths: ["rock_city/**", ".github/workflows/rock-city.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rock-city-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Server tests
        working-directory: rock_city/api
        run: |
          npm ci
          npm test
      - name: App tests and build
        working-directory: rock_city/web
        run: |
          npm ci
          npm test
          npm run build

  api:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see rock_city/README.md)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: rock_city/api
        run: npm ci
      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: rock_city/api
          wranglerVersion: "4.146.0"
      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Worker: $URL" >> "$GITHUB_STEP_SUMMARY"

  web:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: rock_city/web
        run: |
          npm ci
          npm run build
      - name: Create the Pages project (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: rock_city/web
          wranglerVersion: "4.146.0"
          command: pages project create rock-city-school --production-branch=main
      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: rock_city/web
          wranglerVersion: "4.146.0"
          command: pages deploy dist --project-name=rock-city-school --branch=main --commit-dirty=true
      - name: Summary
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          echo "Published: https://rock-city-school.pages.dev ($URL)" >> "$GITHUB_STEP_SUMMARY"

  # עמוד הנחיתה של המוצר ("קצב") – קבצים סטטיים, בלי בנייה -> https://ketzev-music.pages.dev
  landing:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the Pages project (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: rock_city/landing
          wranglerVersion: "4.146.0"
          command: pages project create ketzev-music --production-branch=main
      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: rock_city/landing
          wranglerVersion: "4.146.0"
          command: pages deploy . --project-name=ketzev-music --branch=main --commit-dirty=true
      - name: Summary
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          echo "Landing: https://ketzev-music.pages.dev ($URL)" >> "$GITHUB_STEP_SUMMARY"
