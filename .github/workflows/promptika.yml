name: promptika

# פרומפטיקה (promptika/):
#   api -> Cloudflare Worker "promptika-api" (Durable Object Studio: סיסמה, הגדרות, לקוחות)
#   web -> Cloudflare Pages "promptika" -> https://promptika.pages.dev
on:
  push:
    branches: [main]
    paths: ["promptika/**", ".github/workflows/promptika.yml"]
  pull_request:
    paths: ["promptika/**", ".github/workflows/promptika.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptika-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Server tests
        working-directory: promptika/api
        run: |
          npm ci
          npm test
      - name: App tests and build
        working-directory: promptika/web
        run: |
          npm ci
          npm test
          npm run build

  api:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see promptika/README.md)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: promptika/api
        run: npm ci
      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: promptika/api
          wranglerVersion: "4.146.0"
          secrets: |
            ANTHROPIC_API_KEY
      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Worker: $URL" >> "$GITHUB_STEP_SUMMARY"

  web:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: promptika/web
        run: |
          npm ci
          npm run build
      - name: Create the Pages project (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: promptika/web
          wranglerVersion: "4.146.0"
          command: pages project create promptika --production-branch=main
      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: promptika/web
          wranglerVersion: "4.146.0"
          command: pages deploy dist --project-name=promptika --branch=main --commit-dirty=true
      - name: Summary
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          echo "Published: https://promptika.pages.dev ($URL)" >> "$GITHUB_STEP_SUMMARY"
