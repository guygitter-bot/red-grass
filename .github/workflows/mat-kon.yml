name: mat-kon

# אפליקציית המתכונים (mat_kon/):
#   api -> Cloudflare Worker "mat-kon-api" (מחזיק את מפתח Anthropic ואת ספר המתכונים)
#   web -> Cloudflare Pages "mat-kon"      -> https://mat-kon.pages.dev
on:
  push:
    branches: [main]
    paths: ["mat_kon/**", ".github/workflows/mat-kon.yml"]
  pull_request:
    paths: ["mat_kon/**", ".github/workflows/mat-kon.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mat-kon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Server tests
        working-directory: mat_kon/api
        run: |
          npm ci
          npm test
      - name: App tests and build
        working-directory: mat_kon/web
        run: |
          npm ci
          npm test
          npm run build

  api:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_KEY: ${{ secrets.MATKON_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see mat_kon/README.md)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: mat_kon/api
        run: npm ci
      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.MATKON_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          # מחירון סופרים (לא חובה): https://cheapersal.co.il/developers/keys
          CHEAPERSAL_API_KEY: ${{ secrets.CHEAPERSAL_API_KEY || 'none' }}
          # כניסה עם גוגל (לא חובה): Client ID מ-Google Cloud Console, כמשתנה או סוד במאגר
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID || 'none' }}
          # נעילת הספר של בעל האפליקציה (לא חובה): סיסמת בעלים, ו/או האימייל של חשבון הגוגל שלו
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD || 'none' }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL || secrets.OWNER_EMAIL || 'none' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mat_kon/api
          wranglerVersion: "4.146.0"
          secrets: |
            ANTHROPIC_API_KEY
            CHEAPERSAL_API_KEY
            GOOGLE_CLIENT_ID
            OWNER_PASSWORD
            OWNER_EMAIL
      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Worker: $URL" >> "$GITHUB_STEP_SUMMARY"

  web:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: mat_kon/web
        env:
          VITE_API_URL: ${{ needs.api.outputs.url }}
        run: |
          npm ci
          npm run build
      - name: Create the Pages project (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mat_kon/web
          wranglerVersion: "4.146.0"
          command: pages project create mat-kon --production-branch=main
      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mat_kon/web
          wranglerVersion: "4.146.0"
          command: pages deploy dist --project-name=mat-kon --branch=main --commit-dirty=true
      - name: Summary
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          echo "Published: https://mat-kon.pages.dev ($URL)" >> "$GITHUB_STEP_SUMMARY"
