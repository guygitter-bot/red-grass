name: Deploy GitHub Pages

# GitHub Pages for the repo: the Toto site at the root. The food app moved to
# Cloudflare Pages (bis-deploy.yml); /points/ only forwards to it.
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Assemble site
        run: |
          mkdir -p _site
          cp toto_predictor/web/index.html _site/
          cp -r toto_predictor/data _site/data
          mkdir -p _site/points
          cp points_tracker/redirect.html _site/points/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
