name: voiceover

# קריינות מ-ElevenLabs לעריכת סרטונים בצ'אט: כשמשנים את voiceover/request.json בענף עבודה,
# נוצר קובץ MP3 (voiceover/make.mjs) ומוחזר לאותו ענף.
on:
  push:
    branches-ignore: [main]
    paths: ["voiceover/request.json", "voiceover/make.mjs", ".github/workflows/voiceover.yml"]

permissions:
  contents: write

concurrency:
  group: voiceover-${{ github.ref }}

jobs:
  voice:
    # רק דחיפה של בעל המאגר (הסקריפט רץ עם מפתח ההקראה)
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || 'none' }}
        run: node voiceover/make.mjs
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voiceover/out
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "voiceover: narration audio"
          git push
