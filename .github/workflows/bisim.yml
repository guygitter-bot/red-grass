name: bisim

# אפליקציית "ביסים" (bisim/) - הגרסה המסחרית, נפרדת לגמרי מ"ביס" (points_tracker/):
#   proxy -> Cloudflare Worker "bisim-api" (מחזיק את מפתח Anthropic, מאגר ומכשירים משלו)
#   web   -> Cloudflare Pages "bisim"      -> https://bisim.pages.dev
on:
  push:
    branches: [main]
    paths: ["bisim/**", ".github/workflows/bisim.yml"]
  pull_request:
    paths: ["bisim/**", ".github/workflows/bisim.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bisim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bisim/web/package-lock.json
      - name: Server tests
        working-directory: bisim/proxy
        run: npm test
      - name: App tests and build
        working-directory: bisim/web
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    needs: test
    # עלייה לאוויר רק מ-main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_CODE: ${{ secrets.BISIM_ACCESS_CODE || secrets.POINTS_ACCESS_CODE }}
          API_KEY: ${{ secrets.BISIM_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$ACCESS_CODE" ] || missing="$missing BISIM_ACCESS_CODE"
          [ -n "$API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see bisim/README.md)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bisim/web/package-lock.json
      - name: Deploy server
        uses: cloudflare/wrangler-action@v3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.BISIM_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          ACCESS_CODE: ${{ secrets.BISIM_ACCESS_CODE || secrets.POINTS_ACCESS_CODE }}
          ADMIN_CODE: ${{ secrets.BISIM_ADMIN_CODE || secrets.POINTS_ADMIN_CODE }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bisim/proxy
          wranglerVersion: "4.146.0"
          secrets: |
            ANTHROPIC_API_KEY
            ACCESS_CODE
            ADMIN_CODE
      - name: Build app
        working-directory: bisim/web
        run: |
          npm ci
          npm run build
      - name: Create the Pages project (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bisim/web
          wranglerVersion: "4.146.0"
          command: pages project create bisim --production-branch=main
      - name: Publish app
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bisim/web
          wranglerVersion: "4.146.0"
          command: pages deploy dist --project-name=bisim --branch=main --commit-dirty=true
      - name: Summary
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          echo "Published: $URL" >> "$GITHUB_STEP_SUMMARY"
