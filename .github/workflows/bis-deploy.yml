name: Deploy Bis app

# Builds points_tracker/web and publishes it to Cloudflare Pages, project "bis-app":
#   target production -> branch main    -> https://bis-app.pages.dev
#   target staging    -> branch staging -> https://staging.bis-app.pages.dev
#     (uses the staging proxy bis-api-staging and shows a "סביבת בדיקות" banner)
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        required: false
        default: ""
      target:
        description: "production or staging"
        type: string
        required: false
        default: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: bis-deploy-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: points_tracker/web/package-lock.json
      - name: Build
        working-directory: points_tracker/web
        env:
          VITE_APP_ENV: ${{ inputs.target }}
          VITE_PROXY_URL: ${{ inputs.target == 'staging' && (vars.STAGING_PROXY_URL || 'https://bis-api-staging.guygitter.workers.dev') || '' }}
        run: |
          npm ci
          npm run build
      - name: Create the Pages project (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from the app folder: the repo root has an old package.json whose
          # dependencies conflict, so installing wrangler there fails.
          workingDirectory: points_tracker/web
          wranglerVersion: "4.146.0"
          command: pages project create bis-app --production-branch=main
      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: points_tracker/web
          wranglerVersion: "4.146.0"
          command: pages deploy dist --project-name=bis-app --branch=${{ inputs.target == 'staging' && 'staging' || 'main' }} --commit-dirty=true
      - name: Summary
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          echo "Published (${{ inputs.target }}): $URL" >> "$GITHUB_STEP_SUMMARY"
