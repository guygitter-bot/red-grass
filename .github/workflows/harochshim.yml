name: harochshim

# הרוכשים (harochshim/):
#   api -> Cloudflare Worker "harochshim-api" (קטלוג, עוזר חכם עם Claude, לידים, ניהול)
#   web -> Cloudflare Pages "harochshim" -> https://harochshim.pages.dev
on:
  push:
    branches: [main]
    paths: ["harochshim/**", ".github/workflows/harochshim.yml"]
  pull_request:
    paths: ["harochshim/**", ".github/workflows/harochshim.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harochshim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Server tests
        working-directory: harochshim/api
        run: |
          npm ci
          npm test
      - name: App tests and build
        working-directory: harochshim/web
        run: |
          npm ci
          npm test
          npm run build

  api:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_PW: ${{ secrets.HAROCHSHIM_ADMIN_PASSWORD }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "$ADMIN_PW" ] || echo "::warning::HAROCHSHIM_ADMIN_PASSWORD is not set - the admin screen will stay locked (see harochshim/README.md)"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see harochshim/README.md)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: harochshim/api
        run: npm ci
      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: harochshim/api
          wranglerVersion: "4.146.0"
          secrets: |
            ANTHROPIC_API_KEY
      # סיסמת המנהל – רק אם הוגדרה (בלעדיה מסך הניהול נשאר נעול)
      - name: Admin password
        working-directory: harochshim/api
        env:
          ADMIN_PASSWORD: ${{ secrets.HAROCHSHIM_ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ADMIN_PASSWORD" ]; then
            printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4.146.0 secret put ADMIN_PASSWORD
          fi
      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Worker: $URL" >> "$GITHUB_STEP_SUMMARY"

  web:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: harochshim/web
        run: |
          npm ci
          npm run build
      - name: Create the Pages project (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: harochshim/web
          wranglerVersion: "4.146.0"
          command: pages project create harochshim --production-branch=main
      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: harochshim/web
          wranglerVersion: "4.146.0"
          command: pages deploy dist --project-name=harochshim --branch=main --commit-dirty=true
      - name: Summary
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          echo "Published: https://harochshim.pages.dev ($URL)" >> "$GITHUB_STEP_SUMMARY"
