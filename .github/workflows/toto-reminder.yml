name: Toto credit reminder

on:
  schedule:
    # Wednesday 14:57 UTC (17:57 Israel summer time / 16:57 winter time).
    - cron: "57 14 * * 3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the reminder without sending it"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r toto_predictor/requirements.txt
      - name: Send reminder
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TOTO_EMAIL_TO: ${{ vars.TOTO_EMAIL_TO }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python toto_predictor/reminder.py
