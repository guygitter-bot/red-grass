name: nadlan-video-probe

# בדיקה אמיתית של "סרטון נדל"ן" מול Google: אילו מודלים קיימים, פריים אחד, וסרטון אחד קצר בגרסה המהירה.
# יוצר סרטון אמיתי (עולה בערך דולר), ולכן רץ רק כשמשנים את הקוד שפונה ל-Google, או בהפעלה ידנית.
on:
  pull_request:
    paths:
      - "nadlan_video/api/video.js"
      - "nadlan_video/api/still.js"
      - "nadlan_video/api/google.js"
      - "nadlan_video/api/probe.mjs"
      - ".github/workflows/nadlan-video-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nadlan-video-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Real frame and video against Google
        working-directory: nadlan_video/api
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          get() { sed -n "s/^$1 = \"\(.*\)\"/\1/p" wrangler.toml; }
          IMAGE_MODEL="$(get IMAGE_MODEL)" VIDEO_MODEL="$(get VIDEO_MODEL)" VIDEO_MODEL_FAST="$(get VIDEO_MODEL_FAST)" node probe.mjs
