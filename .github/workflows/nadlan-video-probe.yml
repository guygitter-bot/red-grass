name: nadlan-video-probe

# בדיקה אמיתית של "סרטון נדל"ן" מול Claude ו-Google: רשימת שוטים, אילו מודלים קיימים, פריים אחד, וסרטון אחד בטיוטה.
# יוצר סרטון אמיתי (עולה פחות מדולר), ולכן רץ רק כשמשנים את הקוד שפונה ל-Google, או בהפעלה ידנית.
on:
  pull_request:
    paths:
      - "nadlan_video/api/video.js"
      - "nadlan_video/api/director.js"
      - "nadlan_video/api/still.js"
      - "nadlan_video/api/google.js"
      - "nadlan_video/api/probe.mjs"
      - "nadlan_video/api/e2e.mjs"
      - "nadlan_video/api/studio.js"
      - "nadlan_video/api/worker.js"
      - ".github/workflows/nadlan-video-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nadlan-video-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Real frame and video against Google
        working-directory: nadlan_video/api
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          get() { sed -n "s/^$1 = \"\(.*\)\"/\1/p" wrangler.toml; }
          IMAGE_MODEL="$(get IMAGE_MODEL)" VIDEO_MODEL="$(get VIDEO_MODEL)" node probe.mjs
      # השרת עצמו (אותו קוד כמו באוויר, ב-wrangler dev): סרטון ב-1080p דרך עבודת הרקע, עד הורדת הקובץ
      - name: End to end through the worker (background job, 1080p)
        working-directory: nadlan_video/api
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          printf 'GEMINI_API_KEY=%s\nANTHROPIC_API_KEY=%s\n' "$GEMINI_API_KEY" "$ANTHROPIC_API_KEY" > .dev.vars
          npx --yes wrangler@4.146.0 dev --port 8787 --local > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s -m 2 http://127.0.0.1:8787/health > /dev/null && break; sleep 2; done
          node e2e.mjs http://127.0.0.1:8787 max || { grep -v "^ *at " wrangler.log | tail -30; exit 1; }
