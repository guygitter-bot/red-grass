name: ads-voice

# קריינות ואפקטים לסרטוני הפרסומת (ads/): כש-voice.json של סרטון משתנה בענף עבודה, יוצרים קובצי MP3
# עם ElevenLabs (הסוד ELEVENLABS_API_KEY) ומחזירים אותם לאותו ענף.
on:
  push:
    branches-ignore: [main]
    paths: ["ads/*/voice.json", "ads/voice.mjs", ".github/workflows/ads-voice.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ads-voice-${{ github.ref }}

jobs:
  voice:
    # רק דחיפה של בעל המאגר: הסקריפט רץ עם מפתח ההקראה (ודחיפת הבוט עצמו לא מפעילה שוב)
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate narration and sound effects (ElevenLabs)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || 'none' }}
        run: node ads/voice.mjs
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ads
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "ads: narration and sound effects"
          git push
