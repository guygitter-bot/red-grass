name: tsevet site

# פרסום אתר של הצוות ל-Cloudflare Pages (tsevet/api/sites.js, publish_page): הבעלים לחץ "לפרסם" או "להוריד מהאוויר"
# באפליקציית "צוות" -> השרת שולח אות עם מזהה העבודה. כאן מורידים את הדף והתמונות, ומעלים לפרויקט https://<שם>.pages.dev
# (או מוחקים אותו). לעולם לא נוגעים בפרויקט קיים שהצוות לא יצר (tsevet/render/site.py). תוכן הדף לא מודפס בלוג.
on:
  repository_dispatch:
    types: [tsevet-site]

permissions:
  contents: read

concurrency:
  group: tsevet-site-${{ github.event.client_payload.id }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TSEVET_API: https://tsevet-api.guygitter.workers.dev
      TSEVET_TOKEN: ${{ secrets.POINTS_GITHUB_TOKEN }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JOB_ID: ${{ github.event.client_payload.id }}
    steps:
      - name: Check the request
        run: |
          [ -n "$TSEVET_TOKEN" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] || { echo "::error::Missing secrets"; exit 1; }
          printf '%s' "$JOB_ID" | grep -Eq '^[a-z0-9]{8,32}$' || { echo "::error::Bad id"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download the page
        id: job
        run: python3 tsevet/render/site.py prepare "$JOB_ID"
      - name: Publish
        if: steps.job.outputs.action == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLUG: ${{ steps.job.outputs.slug }}
          EXISTS: ${{ steps.job.outputs.exists }}
        run: |
          if [ "$EXISTS" != "yes" ]; then
            npx --yes wrangler@4 pages project create "$SLUG" --production-branch=main > /dev/null
          fi
          npx --yes wrangler@4 pages deploy .site/dist --project-name="$SLUG" --branch=main --commit-dirty=true > /dev/null
      - name: Take down
        if: steps.job.outputs.action == 'remove' && steps.job.outputs.exists == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLUG: ${{ steps.job.outputs.slug }}
        run: npx --yes wrangler@4 pages project delete "$SLUG" --yes > /dev/null
      - name: Report
        if: always()
        run: |
          if [ "${{ steps.job.outputs.action }}" = "taken" ]; then
            python3 tsevet/render/site.py fail "$JOB_ID" taken
          elif [ "${{ job.status }}" = "success" ] && [ -n "${{ steps.job.outputs.action }}" ]; then
            python3 tsevet/render/site.py done "$JOB_ID"
          else
            python3 tsevet/render/site.py fail "$JOB_ID" failed
          fi
