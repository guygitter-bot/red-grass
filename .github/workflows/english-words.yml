name: english-words

# מילים באנגלית (english_words/):
# english_words/web/public   -> Cloudflare Pages "milim-beanglit" -> https://milim-beanglit.pages.dev
# english_words/admin/public -> Cloudflare Pages "milim-admin"    -> ניהול להורים
# english_words/api          -> Worker "milim-api"                -> https://milim-api.guygitter.workers.dev
on:
  push:
    branches: [main]
    paths: ["english_words/**", ".github/workflows/english-words.yml"]
  pull_request:
    paths: ["english_words/**", ".github/workflows/english-words.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-words-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Server tests
        working-directory: english_words/api
        run: npm test
      - name: App tests
        working-directory: english_words/web
        run: npm test
      - name: Admin tests
        working-directory: english_words/admin
        run: npm test
      - name: Same server address in both apps
        run: cmp english_words/web/public/config.js english_words/admin/public/config.js

  api:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: english_words/api
          wranglerVersion: "4.146.0"
      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Worker: $URL" >> "$GITHUB_STEP_SUMMARY"

  web:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the Pages project (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: english_words/web
          wranglerVersion: "4.146.0"
          command: pages project create milim-beanglit --production-branch=main
      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: english_words/web
          wranglerVersion: "4.146.0"
          command: pages deploy public --project-name=milim-beanglit --branch=main --commit-dirty=true
      - name: Summary
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          echo "Published: https://milim-beanglit.pages.dev ($URL)" >> "$GITHUB_STEP_SUMMARY"

  admin:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the Pages project (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: english_words/admin
          wranglerVersion: "4.146.0"
          command: pages project create milim-admin --production-branch=main
      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: english_words/admin
          wranglerVersion: "4.146.0"
          command: pages deploy public --project-name=milim-admin --branch=main --commit-dirty=true
      - name: Summary
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          echo "Admin: $URL" >> "$GITHUB_STEP_SUMMARY"
