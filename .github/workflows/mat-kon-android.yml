name: mat-kon android

# mat-kon כאפליקציה לאנדרואיד (Capacitor, mat_kon/mobile): עוטף את אותו web/dist.
#   app-debug.apk  – להתקנה ישירה בטלפון לבדיקה (בכל בנייה)
#   app-release.aab – לחנות Google Play (רק כשמוגדרים סודות מפתח ההעלאה: ANDROID_KEYSTORE וכו')
# הקבצים מופיעים בהרצה ב-Actions, תחת Artifacts.
on:
  push:
    branches: [main]
    paths: ["mat_kon/web/**", "mat_kon/mobile/**", ".github/workflows/mat-kon-android.yml"]
  pull_request:
    paths: ["mat_kon/mobile/**", ".github/workflows/mat-kon-android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mat-kon-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3

      - name: Build the web app
        working-directory: mat_kon/web
        run: |
          npm ci
          npm run build
      - name: Copy into the Android project
        working-directory: mat_kon/mobile
        run: |
          npm ci
          npx cap sync android
          # סרטוני ההדרכה לא נארזים באפליקציה (נטענים מהאתר) – כדי שהאפליקציה תהיה קטנה
          rm -rf android/app/src/main/assets/public/tutorials

      - name: Debug APK (for testing on a phone)
        working-directory: mat_kon/mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Release bundle for Google Play (signed with the upload key)
        if: github.event_name != 'pull_request'
        working-directory: mat_kon/mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then echo "אין עדיין מפתח העלאה (ANDROID_KEYSTORE) – מדלגים על הקובץ לחנות"; exit 0; fi
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: mat-kon-android-${{ github.run_number }}
          path: |
            mat_kon/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mat_kon/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
