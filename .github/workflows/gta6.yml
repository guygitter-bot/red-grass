name: gta6

# GTA 6 – סרטונים וקודים (gta6/):
#   api -> Cloudflare Worker "gta6-videos-api" (כותרת וקודים לכל סרטון עם Claude)
#   web -> Cloudflare Pages "gta6-videos" -> https://gta6-videos-97q.pages.dev
on:
  push:
    branches: [main]
    paths: ["gta6/**", ".github/workflows/gta6.yml", ".github/workflows/gta6-fetch.yml"]
  pull_request:
    paths: ["gta6/**", ".github/workflows/gta6.yml", ".github/workflows/gta6-fetch.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Server tests
        working-directory: gta6/api
        run: |
          npm ci
          npm test
      - name: App tests and build
        working-directory: gta6/web
        run: |
          npm ci
          npm test
          npm run build

  api:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN_SECRET: ${{ secrets.POINTS_GITHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "$GEMINI_KEY" ] || missing="$missing GEMINI_API_KEY"
          [ -n "$GH_TOKEN_SECRET" ] || missing="$missing POINTS_GITHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see gta6/README.md)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: gta6/api
        run: npm ci
      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.POINTS_GITHUB_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gta6/api
          wranglerVersion: "4.146.0"
          secrets: |
            ANTHROPIC_API_KEY
            GEMINI_API_KEY
            GITHUB_TOKEN
      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Worker: $URL" >> "$GITHUB_STEP_SUMMARY"

  web:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: gta6/web
        run: |
          npm ci
          npm run build
      - name: Create the Pages project (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gta6/web
          wranglerVersion: "4.146.0"
          command: pages project create gta6-videos --production-branch=main
      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gta6/web
          wranglerVersion: "4.146.0"
          command: pages deploy dist --project-name=gta6-videos --branch=main --commit-dirty=true
      - name: Summary
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          echo "Published: https://gta6-videos-97q.pages.dev ($URL)" >> "$GITHUB_STEP_SUMMARY"
