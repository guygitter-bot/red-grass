<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/rubik.css">
<style>
  :root { --red: #8a1f3c; --red2: #4a0f20; --orange: #e07b39; --yellow: #ffd166; --cream: #fbf3e6; --dark: #1b1716; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--dark); font-family: Rubik, sans-serif; }
  #cam { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .abs { position: absolute; }
  .center { left: 50%; top: 50%; }
  .bg { position: absolute; inset: -80px; background-size: cover; background-position: center; filter: blur(40px) brightness(.5); }
  .txt { position: absolute; left: 0; right: 0; text-align: center; color: #fff; font-weight: 900; line-height: 1.05;
    text-shadow: 0 6px 24px rgba(0,0,0,.55); }
  .word { display: inline-block; }
  .tag { display: inline-block; background: var(--orange); color: #fff; border-radius: 30px; padding: 16px 46px; font-weight: 900; }
  .card { background: #fff; border-radius: 40px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .card img { display: block; width: 100%; }
  .rays { position: absolute; left: 50%; top: 50%; width: 3000px; height: 3000px; margin: -1500px 0 0 -1500px;
    background: repeating-conic-gradient(from 0deg, rgba(224,123,57,.22) 0 10deg, transparent 10deg 20deg); }
  .speed { position: absolute; height: 10px; border-radius: 10px; background: rgba(255,255,255,.8); }
  .wipe { position: absolute; inset: 0; transform: translateX(110%); }
  .particle { position: absolute; top: -200px; font-size: 110px; line-height: 1; opacity: 0; }
  .stamp { display: inline-block; border: 14px solid currentColor; border-radius: 36px; padding: 10px 50px; }
  .clock { width: 620px; height: 620px; border-radius: 50%; background: #fff; border: 22px solid var(--yellow);
    box-shadow: 0 30px 80px rgba(0,0,0,.4); }
  .hand { position: absolute; left: 50%; bottom: 50%; border-radius: 20px; transform-origin: 50% 100%; }
  .tickmark { position: absolute; left: 50%; top: 18px; width: 12px; height: 46px; margin-left: -6px; background: var(--red);
    border-radius: 6px; transform-origin: 50% 271px; }
  .day { display: inline-block; width: 150px; height: 150px; border-radius: 50%; line-height: 150px; font-size: 90px;
    font-weight: 900; margin: 0 8px; background: rgba(255,255,255,.12); color: rgba(255,255,255,.35); }
  .day.on { background: var(--yellow); color: var(--red); }
</style>
</head>
<body>
<div id="cam">

<!-- 1. פתיחה: החנות + לוגו -->
<div class="scene" id="s1">
  <div class="bg" style="background-image:url(3.png)"></div>
  <img id="shop" class="abs center" src="3.png" style="width:1080px;height:2100px;object-fit:cover;object-position:50% 15%">
  <div class="abs" style="inset:0;background:linear-gradient(rgba(0,0,0,.35), transparent 35%, transparent 50%, rgba(0,0,0,.85))"></div>
  <div id="logo1" class="abs card" style="width:620px;left:230px;top:190px"><img src="logo.png"></div>
  <div class="txt" id="t1a" style="bottom:360px;font-size:130px">קרית השרון</div>
  <div id="speed1"></div>
</div>

<!-- 2. מנת פלאפל -->
<div class="scene" id="s2" style="background:var(--cream)">
  <div class="rays" id="rays2" style="background:repeating-conic-gradient(rgba(138,31,60,.08) 0 10deg, transparent 10deg 20deg)"></div>
  <div class="txt" style="top:190px;font-size:150px;color:var(--red);text-shadow:none">
    <span class="word" id="w2a">קונים</span> <span class="word" id="w2b">מנת</span><br><span class="word" id="w2c">פלאפל</span>
  </div>
  <div id="pita" class="abs" style="mix-blend-mode:multiply;left:50%;top:1150px;width:1350px;height:1012px;margin:-506px 0 0 -675px">
    <img src="5.jpg" style="width:100%;clip-path:inset(0 0 0 24%)">
  </div>
</div>

<!-- 3. צ'יפס עף -->
<div class="scene" id="s3">
  <div class="bg" style="background-image:url(2.jpg)"></div>
  <img id="fly" class="abs center" src="2.jpg" style="width:1530px">
  <div class="abs" style="inset:0;background:radial-gradient(transparent 40%, rgba(0,0,0,.6))"></div>
  <div class="txt" id="t3a" style="top:200px;font-size:160px">מקבלים</div>
  <div class="txt" style="top:410px"><span class="tag" id="t3b" style="font-size:170px">צ'יפס</span></div>
  <div class="txt" style="bottom:240px;color:var(--yellow)"><span class="stamp" id="t3c" style="font-size:210px;background:rgba(138,31,60,.85)">חינם!</span></div>
</div>

<!-- 4. ₪0 -->
<div class="scene" id="s4" style="background:radial-gradient(circle at 50% 50%, #fff 0, var(--cream) 45%, #f3c99a 100%)">
  <div class="rays" id="rays4"></div>
  <img id="box" class="abs" src="1.jpg" style="left:50%;top:880px;width:1150px;margin-left:-575px;margin-top:-437px;mix-blend-mode:multiply">
  <div class="abs" id="price" style="left:80px;top:300px;transform-origin:center">
    <div style="background:var(--red);color:#fff;font-weight:900;font-size:190px;border-radius:40px;padding:10px 50px;box-shadow:0 20px 50px rgba(0,0,0,.3)">0 ש״ח</div>
  </div>
  <div class="txt" id="t4a" style="bottom:330px;font-size:96px;color:var(--dark);text-shadow:none">צ'יפס וופל פריך</div>
  <div class="txt" style="bottom:170px"><span class="tag" id="t4b" style="font-size:74px;background:var(--red)">בכל קניית מנת פלאפל</span></div>
</div>

<!-- 5. מתי -->
<div class="scene" id="s5" style="background:linear-gradient(160deg, var(--red), var(--red2))">
  <div class="rays" id="rays5" style="background:repeating-conic-gradient(rgba(255,255,255,.05) 0 10deg, transparent 10deg 20deg)"></div>
  <div class="txt" style="top:170px;font-size:0" id="days">
    <span class="day on">א</span><span class="day on">ב</span><span class="day on">ג</span><span class="day on">ד</span><span class="day on">ה</span>
  </div>
  <div class="txt" id="t5a" style="top:380px;font-size:120px">ראשון עד חמישי</div>
  <div id="clock" class="abs clock" style="left:230px;top:600px">
    <div id="ticks"></div>
    <div id="hourH" class="hand" style="width:30px;height:170px;margin-left:-15px;background:var(--red)"></div>
    <div id="minH" class="hand" style="width:18px;height:250px;margin-left:-9px;background:var(--dark)"></div>
    <div class="abs" style="left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:var(--orange)"></div>
  </div>
  <div class="txt" style="top:1340px"><span id="t5b" style="display:inline-block;background:#fff;color:var(--red);border-radius:50px;padding:24px 60px;font-size:150px;direction:ltr;white-space:nowrap;text-shadow:none;box-shadow:0 20px 60px rgba(0,0,0,.35)">12:00–15:00</span></div>
  <div class="txt" id="t5c" style="top:1640px;font-size:80px;color:var(--yellow)">ארוחת צהריים מושלמת</div>
</div>

<!-- 6. סיום -->
<div class="scene" id="s6">
  <div class="bg" style="background-image:url(4.jpg)"></div>
  <img id="spread" class="abs center" src="4.jpg" style="width:2000px">
  <div class="abs" style="inset:0;background:linear-gradient(rgba(0,0,0,.6), transparent 30%, transparent 50%, rgba(0,0,0,.85))"></div>
  <div id="logo6" class="abs card" style="width:620px;left:230px;top:150px"><img src="logo.png"></div>
  <div class="txt" id="t6a" style="bottom:470px;font-size:100px">צ'יפס חינם עם כל מנה</div>
  <div class="txt" id="t6b" style="bottom:350px;font-size:66px;font-weight:500">א׳–ה׳ · <span dir="ltr">12:00–15:00</span></div>
  <div class="txt" style="bottom:150px"><span class="tag" id="t6c" style="font-size:96px">מחכים לכם!</span></div>
</div>

<div id="fx"></div>
<!-- מעברים בצבעי המותג -->
<div class="wipe" id="wipeA" style="background:var(--orange)"></div>
<div class="wipe" id="wipeB" style="background:var(--red)"></div>
</div>

<script>
// כל האנימציות הן Web Animations עם השהיה מוחלטת מתחילת הסרטון, כדי ש-render.mjs יוכל "לקפוץ" לכל פריים.
const $ = (id) => document.getElementById(id);
const ms = (s) => s * 1000;
function at(el, t, dur, frames, opt = {}) {
  if (typeof el === 'string') el = $(el);
  return el.animate(frames, { delay: ms(t), duration: ms(dur), fill: 'both', easing: 'cubic-bezier(.2,.9,.3,1)', ...opt });
}
const BOUNCE = 'cubic-bezier(.2,1.7,.4,1)';
const pop = (el, t, d = .5) => at(el, t, d, [{ transform: 'scale(0) rotate(-12deg)', opacity: 0 }, { transform: 'scale(1) rotate(0)', opacity: 1 }], { easing: BOUNCE });
const up = (el, t) => at(el, t, .55, [{ transform: 'translateY(140px)', opacity: 0 }, { transform: 'none', opacity: 1 }]);
const slam = (el, t) => at(el, t, .45, [{ transform: 'scale(3.2) rotate(-14deg)', opacity: 0 }, { transform: 'scale(.92) rotate(-6deg)', opacity: 1, offset: .7 }, { transform: 'scale(1) rotate(-6deg)', opacity: 1 }], { easing: 'ease-in' });
const pulse = (el, t, n = 6, base = '') => at(el, t, .5, [{ transform: `${base} scale(1)` }, { transform: `${base} scale(1.07)` }, { transform: `${base} scale(1)` }], { iterations: n, easing: 'ease-in-out', fill: 'none' });
const kb = (el, t, d, z0, z1, x0 = 0, x1 = 0, fill = 'both') => at(el, t, d, [{ transform: `translate(calc(-50% + ${x0}px),-50%) scale(${z0})` }, { transform: `translate(calc(-50% + ${x1}px),-50%) scale(${z1})` }], { easing: 'linear', fill });
const shake = (t) => at('cam', t, .4, [0, 1, 2, 3, 4, 5, 6].map((i) => ({ transform: i === 6 ? 'none' : `translate(${(i % 2 ? -1 : 1) * (26 - i * 4)}px, ${(i % 3 - 1) * (18 - i * 3)}px)` })), { easing: 'linear', fill: 'none' });
const show = (id, t0, t1) => at(id, t0, t1 - t0, [{ visibility: 'visible' }, { visibility: 'visible' }], { fill: 'none', easing: 'linear' });
const spin = (id, t, d, turns) => at(id, t, d, [{ transform: 'rotate(0)' }, { transform: `rotate(${turns * 360}deg)` }], { easing: 'linear' });
// מעבר: פס כתום ואחריו בורדו חוצים את המסך; הסצנה מתחלפת באמצע
const wipe = (t) => { at('wipeA', t - .3, .6, [{ transform: 'translateX(110%)' }, { transform: 'translateX(-110%)' }], { easing: 'cubic-bezier(.7,0,.3,1)', fill: 'none' });
  at('wipeB', t - .22, .6, [{ transform: 'translateX(110%)' }, { transform: 'translateX(-110%)' }], { easing: 'cubic-bezier(.7,0,.3,1)', fill: 'none' }); };

// אקראיות קבועה – כל רינדור יוצא אותו דבר
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function rain(t0, t1, n, emojis) {
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[i % emojis.length];
    p.style.left = `${rnd() * 1000 - 20}px`;
    p.style.fontSize = `${80 + rnd() * 90}px`;
    $('fx').appendChild(p);
    const t = t0 + rnd() * (t1 - t0 - 1.2), r = (rnd() - .5) * 720;
    at(p, t, 1.2 + rnd() * .8, [{ transform: 'translateY(0) rotate(0)', opacity: 1 }, { transform: `translateY(2300px) rotate(${r}deg)`, opacity: 1 }], { easing: 'cubic-bezier(.4,0,.8,.6)', fill: 'none' });
  }
}
function burst(t, x, y, n, emojis) {
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[i % emojis.length];
    p.style.left = `${x - 50}px`; p.style.top = `${y - 50}px`; p.style.fontSize = `${60 + rnd() * 60}px`;
    $('fx').appendChild(p);
    const a = (i / n) * Math.PI * 2 + rnd() * .4, d = 380 + rnd() * 360;
    at(p, t, 1 + rnd() * .5, [{ transform: 'translate(0,0) scale(.3)', opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 300}px) scale(1) rotate(${(rnd() - .5) * 540}deg)`, opacity: 0 }], { easing: 'cubic-bezier(.1,.8,.4,1)', fill: 'none' });
  }
}
function speedLines(parent, t, n) {
  for (let i = 0; i < n; i++) {
    const l = document.createElement('div');
    l.className = 'speed';
    l.style.top = `${200 + rnd() * 1500}px`; l.style.width = `${200 + rnd() * 400}px`;
    $(parent).appendChild(l);
    at(l, t + rnd() * .4, .45, [{ transform: 'translateX(1200px)', opacity: 0 }, { opacity: 1, offset: .3 }, { transform: 'translateX(-900px)', opacity: 0 }], { easing: 'linear', fill: 'none' });
  }
}

// ציר הזמן (שניות) – מותאם לקריינות
const T = { s2: 4.2, s3: 8.4, s4: 14.4, s5: 19.4, s6: 25, end: 30 };

// 1. פתיחה
show('s1', 0, T.s2);
kb('shop', 0, T.s2, 1.25, 1.02);
slam('logo1', .25); shake(.6);
rain(.1, T.s2, 14, ['🍟', '🧆']);
at('t1a', 1.3, .5, [{ transform: 'translateX(-1200px) skewX(20deg)' }, { transform: 'none' }]);
speedLines('speed1', 1.2, 10);
pulse('logo1', 1.4, 5, 'rotate(-6deg)');

// 2. פלאפל
wipe(T.s2); show('s2', T.s2, T.s3);
spin('rays2', T.s2, T.s3 - T.s2, .15);
at('pita', T.s2 + .1, .7, [{ transform: 'translateY(1400px) rotate(25deg)' }, { transform: 'translateY(0) rotate(-3deg)' }], { easing: BOUNCE });
at('pita', T.s2 + .8, T.s3 - T.s2 - .8, [{ transform: 'rotate(-3deg) scale(1)' }, { transform: 'rotate(3deg) scale(1.08)' }], { easing: 'ease-in-out', fill: 'forwards' });
pop('w2a', T.s2 + .3); pop('w2b', T.s2 + .65); pop('w2c', T.s2 + 1.0, .6);
burst(T.s2 + 1.1, 540, 1100, 10, ['✨', '🧆']);

// 3. צ'יפס חינם
wipe(T.s3); show('s3', T.s3, T.s4);
kb('fly', T.s3, .35, 1.6, 1.0); kb('fly', T.s3 + .35, T.s4 - T.s3 - .35, 1.0, 1.18, 0, 0, 'forwards');
rain(T.s3 + .2, T.s4, 20, ['🍟']);
up('t3a', T.s3 + .4);
pop('t3b', T.s3 + 1.1);
slam('t3c', T.s3 + 2.1); shake(T.s3 + 2.45);
burst(T.s3 + 2.45, 540, 1550, 16, ['🍟', '✨', '⭐']);
pulse('t3c', T.s3 + 3, 5, 'rotate(-6deg)');

// 4. ₪0
wipe(T.s4); show('s4', T.s4, T.s5);
spin('rays4', T.s4, T.s5 - T.s4, .25);
at('box', T.s4 + .1, .7, [{ transform: 'scale(.2) rotate(-30deg)', opacity: 0 }, { transform: 'scale(1) rotate(0)', opacity: 1 }], { easing: BOUNCE });
at('box', T.s4 + .8, 1.2, [{ transform: 'translateY(0)' }, { transform: 'translateY(-30px)' }, { transform: 'translateY(0)' }], { iterations: 4, easing: 'ease-in-out', fill: 'none' });
slam('price', T.s4 + .9); shake(T.s4 + 1.25);
burst(T.s4 + 1.25, 330, 420, 12, ['✨', '⭐']);
up('t4a', T.s4 + 1.6); pop('t4b', T.s4 + 2.2);

// 5. מתי
wipe(T.s5); show('s5', T.s5, T.s6);
spin('rays5', T.s5, T.s6 - T.s5, -.2);
for (let i = 0; i < 12; i++) {
  const m = document.createElement('div'); m.className = 'tickmark'; m.style.transform = `rotate(${i * 30}deg)`; $('ticks').appendChild(m);
}
document.querySelectorAll('.day').forEach((d, i) => pop(d, T.s5 + .2 + i * .14, .4));
up('t5a', T.s5 + .9);
pop('clock', T.s5 + .3, .6);
// המחוגים מסתובבים מהר ונעצרים על 12:00, ואז קופצים ל-15:00
at('minH', T.s5 + .6, 1.6, [{ transform: 'rotate(0)' }, { transform: 'rotate(1440deg)' }], { easing: 'cubic-bezier(.3,0,.2,1)' });
at('hourH', T.s5 + .6, 1.6, [{ transform: 'rotate(240deg)' }, { transform: 'rotate(360deg)' }], { easing: 'cubic-bezier(.3,0,.2,1)' });
at('minH', T.s5 + 2.6, 1, [{ transform: 'rotate(1440deg)' }, { transform: 'rotate(2520deg)' }], { easing: 'cubic-bezier(.5,0,.2,1)', fill: 'forwards' });
at('hourH', T.s5 + 2.6, 1, [{ transform: 'rotate(360deg)' }, { transform: 'rotate(450deg)' }], { easing: 'cubic-bezier(.5,0,.2,1)', fill: 'forwards' });
pop('t5b', T.s5 + 2.2);
up('t5c', T.s5 + 3.6);
burst(T.s5 + 3.7, 540, 1700, 10, ['🧆', '🍟']);

// 6. סיום
wipe(T.s6); show('s6', T.s6, T.end + 1);
kb('spread', T.s6, T.end - T.s6, 1.0, 1.12, 60, -60);
slam('logo6', T.s6 + .3); shake(T.s6 + .65);
up('t6a', T.s6 + 1.1); up('t6b', T.s6 + 1.5);
pop('t6c', T.s6 + 1.1);
pulse('t6c', T.s6 + 1.8, 6);
rain(T.s6 + 1.2, T.end, 18, ['🍟', '🧆', '✨']);

// קול: משפטים ואפקטים לפי זמן (render.mjs מערבב אותם עם המוזיקה)
window.AUDIO = [
  { f: 'v1', t: .5 }, { f: 'v2', t: T.s2 + .25 }, { f: 'v3', t: T.s3 + .3 }, { f: 'v4', t: T.s5 + .5 }, { f: 'v5', t: T.s6 + 1.0 },
  { f: 'stamp', t: .5, v: .8 }, { f: 'whoosh', t: 1.2, v: .6 },
  { f: 'whoosh', t: T.s2 - .3, v: .6 }, { f: 'pop', t: T.s2 + .3, v: .5 }, { f: 'pop', t: T.s2 + .65, v: .5 }, { f: 'pop', t: T.s2 + 1.0, v: .5 }, { f: 'sizzle', t: T.s2 + 1.2, v: .35 },
  { f: 'whoosh', t: T.s3 - .3, v: .6 }, { f: 'crunch', t: T.s3 + 1.1, v: .8 }, { f: 'stamp', t: T.s3 + 2.35, v: .9 }, { f: 'sparkle', t: T.s3 + 2.45, v: .5 },
  { f: 'whoosh', t: T.s4 - .3, v: .6 }, { f: 'stamp', t: T.s4 + 1.15, v: .8 }, { f: 'sparkle', t: T.s4 + 1.25, v: .5 }, { f: 'pop', t: T.s4 + 2.2, v: .5 },
  { f: 'whoosh', t: T.s5 - .3, v: .6 }, { f: 'tick', t: T.s5 + .6, v: .6 }, { f: 'pop', t: T.s5 + 2.2, v: .5 },
  { f: 'whoosh', t: T.s6 - .3, v: .6 }, { f: 'stamp', t: T.s6 + .55, v: .8 }, { f: 'sparkle', t: T.s6 + 1.2, v: .5 },
];
</script>
</body>
</html>
