name = "ma-hashir-api"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# האתרים שמותר להם לפנות לשרת (* = כל תת-כתובת, למקרה ש-Cloudflare Pages מוסיף סיומת לשם)
ALLOWED_ORIGINS = "https://ma-hashir.pages.dev,https://*.ma-hashir.pages.dev,https://ma-hashir-*.pages.dev,http://localhost:5173,http://localhost:4173"

# כל משחק – אובייקט משלו (לפי הקוד שלו)
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# ספרייה אחת שזוכרת איפה שומעים כל שיר
[[durable_objects.bindings]]
name = "LIBRARY"
class_name = "Library"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Library"]
