<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>חשבון לכיתה ד'</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
<style>
  :root {
    --page: #eff6ff; --card: #ffffff; --ink: #1e293b; --soft: #2563eb; --muted: #64748b;
    --main: #2563eb; --main-ink: #ffffff; --line: #dbeafe;
    --good: #16a34a; --good-bg: #dcfce7; --bad: #dc2626; --bad-bg: #fee2e2; --gold: #f59e0b;
    --s1: #3b82f6; --s2: #f59e0b; --s3: #10b981; --s4: #ec4899; --svgsoft: #dbeafe; --svggray: #9ca3af;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0f172a; --card: #1e293b; --ink: #f1f5f9; --soft: #93c5fd; --muted: #94a3b8;
      --main: #3b82f6; --main-ink: #ffffff; --line: #334155;
      --good: #4ade80; --good-bg: #14532d; --bad: #f87171; --bad-bg: #7f1d1d; --gold: #fbbf24;
      --s1: #60a5fa; --s2: #fbbf24; --s3: #34d399; --s4: #f472b6; --svgsoft: #334155; --svggray: #94a3b8;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: system-ui, "Segoe UI", Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; min-height: 100dvh; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 8px 0 0; font-size: 28px; text-align: center; }
  h2 { margin: 0 0 12px; font-size: 20px; }
  .sub { text-align: center; color: var(--muted); margin: 0; }
  .card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  button { font: inherit; border: 0; border-radius: 16px; cursor: pointer; color: inherit; }
  .big { background: var(--main); color: var(--main-ink); font-size: 22px; font-weight: 700; padding: 16px; width: 100%; }
  .big:disabled { opacity: .5; }
  .ghost { background: transparent; color: var(--soft); font-size: 17px; padding: 10px; }
  .bar { height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--good); width: 0; transition: width .4s; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .top .ghost { padding: 6px 0; }
  .stars { font-weight: 700; font-size: 18px; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .msg { text-align: center; font-size: 20px; min-height: 30px; margin: 8px 0 0; font-weight: 700; }
  .msg.good { color: var(--good); } .msg.bad { color: var(--bad); }
  .note { font-size: 15px; color: var(--muted); text-align: center; margin: 0; }
  .hidden { display: none !important; }
  input { font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--page); color: var(--ink); min-width: 0; }
  #hello button { color: var(--soft); background: none; font-size: 15px; text-decoration: underline; }

  /* מסך הבית */
  .topics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .topic { background: var(--page); color: var(--ink); padding: 12px; text-align: right; display: flex; flex-direction: column; gap: 2px; border: 2px solid var(--line); }
  .topic .icon { font-size: 28px; line-height: 1.2; }
  .topic b { font-size: 17px; }
  .topic small { color: var(--muted); font-size: 13px; }
  .topic em { font-style: normal; font-weight: 700; color: var(--muted); font-size: 15px; }
  .topic.passed { border-color: var(--good); background: var(--good-bg); }
  .topic.passed em { color: var(--good); }
  .topic.going em.going { color: var(--soft); }
  .topic.locked { opacity: .55; cursor: default; }
  .sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sechead span { color: var(--muted); font-size: 15px; font-weight: 600; }
  .card.ready { border: 3px solid var(--gold); box-shadow: 0 0 0 4px rgba(245,158,11,.25); }
  .card.ready .big { background: var(--gold); color: #1e293b; }

  /* השאלה */
  .qtext { font-size: 22px; font-weight: 700; line-height: 1.5; text-align: center; margin: 4px 0 8px; }
  .expr { direction: ltr; text-align: center; font-size: 36px; font-weight: 800; letter-spacing: 1px; margin: 8px 0; unicode-bidi: isolate; word-break: break-word; }
  .fig { display: flex; justify-content: center; margin: 8px 0 12px; color: var(--ink); }
  .fig svg { max-width: 100%; height: auto; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .choices.one { grid-template-columns: 1fr; }
  .choice { background: var(--card); color: var(--ink); border: 3px solid var(--line); font-size: 22px; font-weight: 700; padding: 16px 8px; min-height: 64px; line-height: 1.35; }
  .choice.letter { font-size: 32px; }
  .choice.good { background: var(--good-bg); border-color: var(--good); }
  .choice.bad { background: var(--bad-bg); border-color: var(--bad); }
  .choice:disabled { cursor: default; }
  .choice:last-child:nth-child(odd) { grid-column: span 2; }
  .numrow { display: flex; gap: 10px; margin-top: 8px; }
  .numrow input { flex: 1; direction: ltr; text-align: center; font-size: 32px; font-weight: 800; padding: 10px; }
  .numrow input.good { border-color: var(--good); background: var(--good-bg); }
  .numrow input.bad { border-color: var(--bad); background: var(--bad-bg); }
  .numrow button { flex: 0 0 120px; font-size: 20px; }
  .explain { background: var(--page); border-radius: 16px; padding: 14px; margin-top: 12px; font-size: 18px; line-height: 1.55; border-right: 6px solid var(--bad); }
  .explain b { color: var(--bad); }
  bdi { white-space: nowrap; }
  .fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.15; margin: 0 .12em; font-size: .85em; }
  .fr i { font-style: normal; padding: 0 .22em; }
  .fr i:first-child { border-bottom: .09em solid currentColor; }
  .list { display: grid; gap: 8px; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--page); font-size: 17px; text-align: right; }
  .item.weak { background: var(--bad-bg); }
  .item.done { background: var(--good-bg); }
  .item span:first-child { flex: 1; }
  .item .exp { direction: ltr; unicode-bidi: isolate; font-weight: 700; }
  .pic { text-align: center; font-size: 72px; line-height: 1; }
  @media (min-width: 1024px) {
    main { max-width: 820px; padding-top: 40px; }
    .topics { grid-template-columns: 1fr 1fr 1fr; }
    .expr { font-size: 44px; }
    .qtext { font-size: 24px; }
    .choice:last-child:nth-child(odd) { grid-column: auto; }
  }
</style>
</head>
<body>
<main id="app">
  <!-- מסך הבית -->
  <section id="home">
    <h1>🧮 חשבון לכיתה ד'</h1>
    <p class="sub">מתכוננים למבחן בחשבון. צריך 80% כדי לעבור כל תרגול</p>
    <div class="card" id="nameCard" style="margin-top:16px">
      <h2>👋 איך קוראים לך?</h2>
      <div class="row">
        <input id="nameInput" maxlength="30" placeholder="השם שלי" autocomplete="off">
        <button class="big" id="nameSave" style="flex:0 0 100px">שמירה</button>
      </div>
    </div>
    <p class="sub hidden" id="hello" style="margin-top:12px"></p>
    <div class="card" style="margin-top:16px">
      <div class="top"><h2 style="margin:0" id="overall"></h2><span class="stars" id="homeStars"></span></div>
      <div class="bar" style="margin:12px 0 8px"><i id="homeBar"></i></div>
      <p class="note" id="overallNote"></p>
    </div>
    <div id="sections" style="display:flex;flex-direction:column;gap:16px;margin-top:16px"></div>
    <div class="card" id="examCard" style="margin-top:16px">
      <h2>🎓 מבחן מסכם</h2>
      <p class="note" id="examBest" style="margin-bottom:16px"></p>
      <button class="big" id="startExam">🎓 למבחן המסכם</button>
    </div>
    <button class="ghost" id="reset" style="width:100%;margin-top:8px">להתחיל הכול מההתחלה</button>
  </section>

  <!-- סוף סיבוב -->
  <section id="result" class="hidden">
    <div class="card" style="margin-top:24px;text-align:center">
      <div class="pic" id="resPic"></div>
      <p class="msg" id="resScore" style="font-size:26px"></p>
      <p class="msg" id="resMsg"></p>
      <p class="note hidden" id="resMissTitle" style="margin-top:16px">כדאי לחזור על:</p>
      <div class="list" id="resList" style="margin-top:8px"></div>
      <button class="big" id="resGo" style="margin-top:16px"></button>
      <button class="ghost" id="resHome" style="width:100%;margin-top:8px">למסך הראשי</button>
    </div>
  </section>

  <!-- מסך התרגול -->
  <section id="play" class="hidden">
    <div class="top">
      <button class="ghost" id="back">→ חזרה</button>
      <span class="note"><span id="pos"></span> <span id="topicName"></span></span>
      <span class="stars" id="stars"></span>
    </div>
    <div class="bar" style="margin:8px 0 12px"><i id="playBar"></i></div>
    <div class="card">
      <p class="qtext" id="qtext"></p>
      <div class="expr hidden" id="expr"></div>
      <div class="fig hidden" id="fig"></div>
      <div class="choices" id="choices"></div>
      <div class="numrow hidden" id="numrow">
        <input id="numInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="6" placeholder="?" aria-label="התשובה">
        <button class="big" id="numCheck">בדיקה</button>
      </div>
      <p class="msg" id="msg"></p>
      <div class="explain hidden" id="explain"></div>
      <button class="big hidden" id="next" style="margin-top:12px">הבאה ←</button>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
