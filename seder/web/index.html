<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="סדר" />
    <meta name="description" content="משימות, תזכורות ומחשבות – הכול במקום אחד, לפי תחומי חיים" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <title>יהיה בסדר · משימות</title>
    <script>
      // מצב לילה מיד בטעינה, כדי שלא יהבהב מסך לבן (הלוגיקה המלאה ב-src/lib/theme.js)
      try {
        var t = localStorage.getItem('seder_theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131118');
        }
      } catch (e) {}
      // גודל הטקסט מההגדרות (הלוגיקה המלאה ב-src/lib/fontsize.js)
      try {
        var f = { large: 1.125, xlarge: 1.25 }[localStorage.getItem('seder_font')];
        if (f) document.documentElement.style.setProperty('--font-scale', String(f));
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
