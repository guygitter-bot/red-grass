name = "ai-maagar-api"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# האתרים שמותר להם לפנות לשרת (האפליקציה ב-Cloudflare Pages ופיתוח מקומי)
ALLOWED_ORIGINS = "https://ai-maagar.pages.dev,http://localhost:5173,http://localhost:4173"

# כל החומר (קישורים, קבצים, קטגוריות) – אובייקט אחד ("main")
[[durable_objects.bindings]]
name = "LIBRARY"
class_name = "Library"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Library"]

# סודות, לא כאן (נקבעים אוטומטית מ-GitHub, ראו .github/workflows/ai-maagar.yml):
#   ANTHROPIC_API_KEY  – המפתח של Claude (המיפוי לקטגוריות)
